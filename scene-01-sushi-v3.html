<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>行舟入墨 · 苏轼 × 舣舟亭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#efe7d6; --paper-hi:#f7f1e4; --paper-lo:#e3d8c1;
  --ink:#1c1b19; --ink-2:#3a3833; --ink-soft:rgba(28,27,25,.55);
  --seal:#b03a2e; --gold:#e3bf63; --bar:#16140f;
  --brush:"Ma Shan Zheng","STXingkai","STKaiti","KaiTi",serif;
  --serif:"Noto Serif SC","Songti SC","SimSun",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--serif)}
button{font:inherit;color:inherit}

/* ---------- 场景层 ---------- */
#stage{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#stage.dragging{cursor:grabbing}
#sky{position:absolute;inset:0;background:
  radial-gradient(ellipse 70% 55% at 50% 28%, var(--paper-hi) 0%, transparent 70%),
  linear-gradient(180deg,#ece3cf 0%,var(--paper) 45%,#e8dfcb 100%)}
.layer{position:absolute;left:0;top:0;will-change:transform}
.layer svg{display:block;overflow:visible}
#boat{position:absolute;left:0;top:0;will-change:transform;transform-origin:50% 56%}
#boat svg{display:block;overflow:visible}
#grain{position:fixed;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.5;z-index:25}
#vignette{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(ellipse at center, transparent 52%, rgba(92,66,32,.20) 100%)}

.marker .ring{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
.marker .ring.r2{animation-delay:1.1s}
@keyframes pulse{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.marker .dot{transform-box:fill-box;transform-origin:center;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;
  padding:18px 22px;pointer-events:none;z-index:5;transition:opacity .6s}
.chapter{display:flex;gap:12px;align-items:center}
.seal-sm{width:34px;height:34px;display:grid;place-items:center;background:var(--seal);color:var(--paper-hi);
  font-family:var(--brush);font-size:22px;border-radius:3px;box-shadow:inset 0 0 0 2px rgba(255,240,220,.25)}
.chapter b{display:block;font-family:var(--brush);font-weight:400;font-size:26px;letter-spacing:.12em;line-height:1}
.chapter small{display:block;margin-top:5px;font-size:12px;letter-spacing:.18em;color:var(--ink-soft)}
#progress{list-style:none;display:flex;gap:18px;margin-top:4px}
#progress li{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;letter-spacing:.2em;color:var(--ink-soft)}
#progress i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink-soft);transition:background .6s,border-color .6s,transform .6s}
#progress li.done i{background:var(--ink);border-color:var(--ink);transform:scale(1.15)}
#progress li.done{color:var(--ink)}

/* ---------- 故事卡 ---------- */
#card{position:fixed;left:24px;top:92px;width:min(380px,calc(100vw - 32px));z-index:6;
  background:rgba(247,241,228,.93);border:1px solid rgba(28,27,25,.28);
  box-shadow:0 10px 30px rgba(60,40,10,.12), inset 0 0 0 5px rgba(247,241,228,.93), inset 0 0 0 6px rgba(28,27,25,.15);
  padding:22px 24px 20px 24px;opacity:0;transform:translateY(16px);filter:blur(6px);
  transition:opacity .8s ease, transform .8s ease, filter .8s ease;pointer-events:none}
#card.show{opacity:1;transform:none;filter:none}
#card .seal{position:absolute;right:18px;top:-14px;width:40px;height:40px;display:grid;place-items:center;
  background:var(--seal);color:var(--paper-hi);font-family:var(--brush);font-size:26px;border-radius:3px;transform:rotate(-4deg)}
#card h2{font-family:var(--brush);font-weight:400;font-size:32px;letter-spacing:.14em;margin-bottom:8px}
#card p{font-size:15px;line-height:1.95;color:var(--ink-2);text-align:justify}
#card small{display:block;margin-top:10px;font-size:12px;color:var(--ink-soft);letter-spacing:.05em}
#card small:empty{display:none}

#hint{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:6;text-align:center;
  font-size:15px;letter-spacing:.2em;color:var(--ink-2);pointer-events:none;transition:opacity .8s}
#hint .arrow{display:inline-block;font-family:var(--brush);font-size:22px;animation:nudge 1.4s ease-in-out infinite}
#hint small{display:block;margin-top:4px;font-size:12px;color:var(--ink-soft);letter-spacing:.15em}
@keyframes nudge{50%{transform:translateX(8px)}}
#hint.hide{opacity:0}

#foot{position:fixed;right:18px;bottom:12px;font-size:11px;letter-spacing:.12em;color:var(--ink-soft);z-index:5;pointer-events:none}

.drop{position:fixed;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50% 46% 52% 48%;background:var(--ink);
  z-index:7;pointer-events:none;transition:left .95s cubic-bezier(.6,.05,.3,1), top .95s cubic-bezier(.6,.05,.3,1), transform .95s, opacity .3s .9s;
  box-shadow:0 0 0 3px rgba(28,27,25,.12)}

/* ---------- 剧情演出 ---------- */
#cut{position:fixed;inset:0;z-index:20;display:none;background:var(--paper);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
#cut.on{display:block}
#cutSvg{position:absolute;inset:0;width:100%;height:100%;display:block}
#cut .bar{position:absolute;left:0;right:0;height:8vh;min-height:44px;background:var(--bar);display:flex;align-items:center;
  justify-content:space-between;padding:0 24px;color:rgba(239,231,214,.75);z-index:2}
#cut .bar.top{top:0}
#cut .bar.bot{bottom:0;justify-content:center}
#cutTitle{font-family:var(--brush);font-size:22px;letter-spacing:.25em}
#cutTitle em{font-style:normal;color:var(--gold);margin-right:10px}
#skipBtn{background:transparent;border:1px solid rgba(239,231,214,.35);color:rgba(239,231,214,.8);padding:4px 14px;
  font-size:13px;letter-spacing:.2em;cursor:pointer;border-radius:2px}
#skipBtn:hover{border-color:var(--gold);color:var(--gold)}
#gPrompt{display:flex;gap:10px;align-items:center;font-size:14px;letter-spacing:.18em;color:#efe7d6;opacity:0;transition:opacity .4s}
#gPrompt.on{opacity:1}
.mouse{width:14px;height:21px;border:1.5px solid currentColor;border-radius:7px;position:relative;flex:none}
.mouse::after{content:'';position:absolute;left:50%;top:3px;width:2px;height:5px;margin-left:-1px;background:var(--gold);border-radius:1px}
#gest{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
#gest .chev{animation:chev 1.3s ease-in-out infinite}
@keyframes chev{0%,100%{opacity:.25}50%{opacity:1}}
#gest .start{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
#dlg{position:absolute;left:50%;bottom:calc(max(8vh,44px) + 14px);transform:translateX(-50%);width:min(900px,calc(100vw - 32px));
  text-align:center;opacity:0;transition:opacity .35s;pointer-events:none;z-index:4}
#dlg.show{opacity:1}
#dlg .who{font-family:var(--brush);font-size:30px;color:var(--seal);letter-spacing:.25em;line-height:1.1;
  text-shadow:0 0 8px var(--paper-hi),0 0 16px var(--paper-hi)}
#dlg.narr .who{display:none}
#dlg .line{display:inline-block;margin-top:6px;padding:10px 60px;font-size:20px;line-height:1.8;color:var(--ink);
  background:linear-gradient(90deg,transparent,rgba(247,241,228,.94) 14%,rgba(247,241,228,.94) 86%,transparent)}
#dlg.narr .line{color:var(--ink-2);font-size:18px}
#dlg .note{font-size:13px;color:var(--ink-soft);margin-top:2px;min-height:1em;text-shadow:0 0 6px var(--paper-hi)}
#dlg .more{font-size:12px;color:var(--ink-soft);opacity:0;height:14px}
#dlg.ready .more{opacity:1;animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.breath{transform-box:fill-box;transform-origin:50% 100%;animation:breath 4.5s ease-in-out infinite}
@keyframes breath{50%{transform:scale(1.004,1.01)}}

#ink{position:fixed;left:0;top:0;width:600px;height:600px;margin:-300px 0 0 -300px;pointer-events:none;z-index:30;
  transform:scale(0);opacity:1;will-change:transform,opacity}
#ink svg{display:block;width:600px;height:600px;overflow:visible}

/* ---------- 开场 ---------- */
#intro{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:var(--paper);
  clip-path:inset(0 0 0 0);transition:clip-path 1.6s cubic-bezier(.7,0,.2,1)}
#intro.open{clip-path:inset(0 50% 0 50%)}
#intro .rod{position:absolute;top:0;bottom:0;width:14px;background:linear-gradient(90deg,#5a3d22,#8b6236 45%,#4a301a);opacity:.9}
#intro .rod.l{left:0}#intro .rod.r{right:0}
#intro .inner{display:flex;gap:44px;align-items:center}
#intro h1{writing-mode:vertical-rl;font-family:var(--brush);font-weight:400;font-size:clamp(64px,11vh,108px);letter-spacing:.18em;line-height:1}
#intro .meta{writing-mode:vertical-rl;font-size:15px;letter-spacing:.4em;color:var(--ink-soft);line-height:2.2}
#intro .meta em{font-style:normal;color:var(--seal)}
#startBtn{width:86px;height:86px;border:none;border-radius:4px;background:var(--seal);color:var(--paper-hi);
  font-family:var(--brush);font-size:30px;letter-spacing:.1em;cursor:pointer;box-shadow:inset 0 0 0 3px rgba(255,240,220,.3);
  transform:rotate(-3deg);transition:transform .25s}
#startBtn:hover{transform:rotate(0) scale(1.06)}

/* ---------- 结尾 ---------- */
#ending{position:fixed;left:24px;top:92px;z-index:9;pointer-events:none;opacity:0;transition:opacity 1.2s}
#ending.show{opacity:1;pointer-events:auto}
#ending .panel{position:relative;width:min(400px,calc(100vw - 32px));background:rgba(247,241,228,.95);
  border:1px solid rgba(28,27,25,.3);padding:34px 32px 26px;text-align:center;
  box-shadow:0 20px 60px rgba(60,40,10,.18), inset 0 0 0 6px rgba(247,241,228,.95), inset 0 0 0 7px rgba(28,27,25,.14)}
#ending .stamp{width:92px;height:92px;margin:0 auto 18px;display:grid;place-items:center;background:var(--seal);color:var(--paper-hi);
  font-family:var(--brush);font-size:38px;line-height:1;writing-mode:vertical-rl;letter-spacing:.05em;border-radius:4px;
  box-shadow:inset 0 0 0 4px rgba(255,240,220,.28);transform:scale(2.2) rotate(-12deg);opacity:0;transition:transform .5s cubic-bezier(.3,1.6,.5,1) .4s, opacity .2s .4s}
#ending.show .stamp{transform:scale(1) rotate(-4deg);opacity:1}
#ending p{font-size:16px;line-height:2;color:var(--ink-2)}
#ending .got{margin-top:12px;font-size:13px;color:var(--ink-soft);letter-spacing:.1em}
#ending .got b{color:var(--ink);font-weight:600}
#ending .btns{display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap}
#ending button{padding:10px 18px;border:1px solid var(--ink);background:transparent;cursor:pointer;letter-spacing:.15em;font-size:14px}
#ending button.primary{background:var(--ink);color:var(--paper-hi)}
#ending button:disabled{opacity:.45;cursor:not-allowed}

@media (max-width:640px){
  #hud{padding:12px 14px}
  .chapter b{font-size:20px}
  .chapter small{display:none}
  #progress{gap:10px}
  #card{left:16px;top:auto;bottom:16px;padding:18px 18px 16px}
  #ending{left:16px;top:auto;bottom:16px}
  #card h2{font-size:26px}
  #card p{font-size:14px}
  #foot{display:none}
  #dlg .who{font-size:24px}
  #dlg .line{font-size:16px;padding:8px 24px}
  #cutTitle{font-size:17px}
}
</style>
</head>
<body>

<!-- 共享滤镜、渐变与人物符号 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs id="gdefs">
    <filter id="fInkEdge" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="12" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.7"/>
    </filter>
    <filter id="fWash" x="-10%" y="-20%" width="120%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.01 0.035" numOctaves="3" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="30" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="3.5"/>
    </filter>
    <filter id="fSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="fBleed" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.35"/>
    </filter>
    <filter id="fRipple" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.09" numOctaves="2" seed="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="1.4"/>
    </filter>
    <filter id="fGhost" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="fDof" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="80" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="3"/>
    </filter>

    <linearGradient id="gFar1" gradientUnits="userSpaceOnUse" x1="0" y1="290" x2="0" y2="590">
      <stop offset="0" stop-color="#1c1b19" stop-opacity=".17"/><stop offset="1" stop-color="#1c1b19" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gFar2" gradientUnits="userSpaceOnUse" x1="0" y1="380" x2="0" y2="610">
      <stop offset="0" stop-color="#1c1b19" stop-opacity=".27"/><stop offset="1" stop-color="#1c1b19" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gMid" gradientUnits="userSpaceOnUse" x1="0" y1="360" x2="0" y2="620">
      <stop offset="0" stop-color="#1c1b19" stop-opacity=".58"/>
      <stop offset=".6" stop-color="#1c1b19" stop-opacity=".16"/>
      <stop offset="1" stop-color="#1c1b19" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gMist" gradientUnits="userSpaceOnUse" x1="0" y1="440" x2="0" y2="600">
      <stop offset="0" stop-color="#efe7d6" stop-opacity="0"/><stop offset=".75" stop-color="#efe7d6" stop-opacity=".92"/>
      <stop offset="1" stop-color="#efe7d6" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="gBank" gradientUnits="userSpaceOnUse" x1="0" y1="470" x2="0" y2="570">
      <stop offset="0" stop-color="#1c1b19" stop-opacity=".03"/><stop offset="1" stop-color="#1c1b19" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="gWater" gradientUnits="userSpaceOnUse" x1="0" y1="566" x2="0" y2="800">
      <stop offset="0" stop-color="#1c1b19" stop-opacity=".09"/><stop offset=".45" stop-color="#1c1b19" stop-opacity=".025"/>
      <stop offset="1" stop-color="#1c1b19" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="gNear" gradientUnits="userSpaceOnUse" x1="0" y1="780" x2="0" y2="900">
      <stop offset="0" stop-color="#1c1b19" stop-opacity=".30"/><stop offset=".35" stop-color="#1c1b19" stop-opacity=".12"/>
      <stop offset="1" stop-color="#1c1b19" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="gDusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b0562e" stop-opacity=".22"/><stop offset=".6" stop-color="#c9874e" stop-opacity=".10"/>
      <stop offset="1" stop-color="#c9874e" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>

<div id="stage">
  <div id="sky"></div>
  <div class="layer" id="L-far"></div>
  <div class="layer" id="L-mid"></div>
  <div class="layer" id="L-main"></div>

</div>

<header id="hud">

  </div>
  <ol id="progress">
    <li><i></i><span>择居</span></li>
    <li><i></i><span>北归</span></li>

</header>

<aside id="card" aria-live="polite">
  <div class="seal" id="cardSeal">壹</div>

  <p id="cardText"></p>

</aside>

<div id="hint" class="hide">按住画面向右拖动 <span class="arrow">→</span><small>或使用 → 键 / 滚轮 · 点击水面试试</small></div>

<section id="cut" aria-live="polite">

  <div class="bar top"><span id="cutTitle"></span><button id="skipBtn">跳过 ››</button></div>

  <svg id="gest"></svg>
  <div id="dlg"><div class="who" id="dWho"></div><div class="line" id="dText"></div><div class="note" id="dNote"></div><div class="more">▼</div></div>

    <p>一叶小舟靠岸的地方，<br>后人筑起了一座亭。</p>

    <div class="btns">
      <button id="againBtn">再泛一次</button>
      <button class="primary" disabled title="样本中未包含">下一章 · 经纬织城 →</button>
    </div>
  </div>
</section>

<script>
(() => {
const W = 4400, H = 900, NS = 'http://www.w3.org/2000/svg';
const FAR = 566, NEAR = 792, WATER = 668;
const PAPER = '#efe7d6', WALL = '#f7f1e4', STONE = '#e7ddc8', SKIN = '#f1e6d0', ROBE = '#ebe1cb', INDIGO = '#3e5560', SEAL = '#b03a2e';
const BRUSH = '"Ma Shan Zheng","STKaiti","KaiTi",serif';

/* ================= 工具 ================= */
let sd = 20261023;
const rnd = () => (sd = (sd * 16807) % 2147483647, (sd - 1) / 2147483646);
const R = (a, b) => a + (b - a) * rnd();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const seg = (p, a, b) => clamp((p - a) / (b - a), 0, 1);
const easeOut = t => 1 - Math.pow(1 - t, 3);
const ink = a => `rgba(28,27,25,${a})`;
const paper = a => `rgba(239,231,214,${a})`;
const f1 = n => (+n).toFixed(1);
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) k === 'text' ? (e.textContent = attrs[k]) : e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function noise1() {
  const p = [R(0, 6.3), R(0, 6.3), R(0, 6.3), R(0, 6.3)];
  return x => Math.sin(x * .0037 + p[0]) * .5 + Math.sin(x * .011 + p[1]) * .28 + Math.sin(x * .031 + p[2]) * .14 + Math.sin(x * .09 + p[3]) * .08;
}
function smooth(pts) {
  let d = `M${f1(pts[0][0])},${f1(pts[0][1])}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
    d += ` Q${f1(pts[i][0])},${f1(pts[i][1])} ${f1(mx)},${f1(my)}`;
  }
  const l = pts[pts.length - 1];
  return d + ` L${f1(l[0])},${f1(l[1])}`;
}

function ridge(x0, x1, base, hmin, hmax, wmin, wmax, gap) {
  const peaks = [];
  for (let c = x0 - 150; c < x1 + 250; c += R(gap * .55, gap * 1.4)) peaks.push({ c, w: R(wmin, wmax), h: R(hmin, hmax) });
  const nz = noise1(), pts = [];
  for (let x = x0; x <= x1; x += 5) {
    let m = 0;
    for (const p of peaks) { const t = Math.abs(x - p.c) / p.w; m = Math.max(m, p.h * Math.exp(-Math.pow(t, 1.35))); }
    pts.push([x, base - m + nz(x * 2.5) * 7]);
  }

}

function bez(p0, c1, c2, p3, n) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    pts.push([u * u * u * p0[0] + 3 * u * u * t * c1[0] + 3 * u * t * t * c2[0] + t * t * t * p3[0],

  }

}

    let dx = b[0] - a[0], dy = b[1] - a[1];
    const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
    const w = (w0 + (w1 - w0) * i / (n - 1)) / 2 * (1 + wob * Math.sin(i * 1.9 + ph));
    Lp.push([pts[i][0] - dy * w, pts[i][1] + dx * w]);
    Rp.push([pts[i][0] + dy * w, pts[i][1] - dx * w]);
  }

}

function inkCover(x, y) {

// 切换镜头：第一个镜头在墨色遮罩下直接搭好，再揭开
async function shot(build) {
  const old = Cut.layer;
  if (old && !Cut.first) { old.style.transition = 'opacity .45s'; old.style.opacity = 0; await sleep(450); }
  if (old) old.remove();
  const g = el('g', {}, cutSvg);
  Cut.layer = g;
  const ctx = build(g) || {};

  else { g.style.opacity = 0; void g.getBoundingClientRect(); g.style.transition = 'opacity .6s'; g.style.opacity = 1; await sleep(550); }

}
function say(who, text, note = '') {
  return new Promise(res => {
    const narr = who === '旁白';
    dlg.classList.toggle('narr', narr);
    dWho.textContent = narr ? '' : who; dNote.textContent = note; dText.textContent = '';
    dlg.classList.add('show'); dlg.classList.remove('ready');
    let i = 0, typing = true, closed = false;
    const tm = setInterval(() => { i++; dText.textContent = text.slice(0, i); if (i >= text.length) endType(); }, 42);
    function endType() { clearInterval(tm); dText.textContent = text; typing = false; dlg.classList.add('ready'); }
    function adv() { if (typing) { endType(); return; } finish(); }
    function onKey(e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); adv(); } }
    function finish() {
      if (closed) return; closed = true;
      cutEl.removeEventListener('pointerdown', adv); removeEventListener('keydown', onKey);
      clearInterval(tm); dText.textContent = text; dlg.classList.remove('ready'); Cut.cancel = null; res();

}
function toScreen(x, y) {
  const m = cutSvg.getScreenCTM(), p = cutSvg.createSVGPoint();

}
// 沿箭头划动：划动进度 0→1 直接驱动画面
function gesture({ dir, prompt, at, len, onProgress }) {
  return new Promise(res => {
    const v = { down: [0, 1], up: [0, -1], right: [1, 0], left: [-1, 0] }[dir];
    const a = toScreen(at[0], at[1]), L = Math.max(80, len * a.k);
    const b = { x: a.x + v[0] * L, y: a.y + v[1] * L };
    gestSvg.setAttribute('viewBox', `0 0 ${innerWidth} ${innerHeight}`);
    gestSvg.innerHTML = '';
    el('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: ink(.35), 'stroke-width': 6, 'stroke-linecap': 'round' }, gestSvg);
    el('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: 'rgba(250,244,230,.9)', 'stroke-width': 2, 'stroke-dasharray': '2 10', 'stroke-linecap': 'round' }, gestSvg);
    const ang = Math.atan2(v[1], v[0]) * 180 / Math.PI;
    const n = Math.max(3, Math.floor(L / 54));
    for (let i = 1; i <= n; i++) {
      const t = i / (n + 1), cx = a.x + v[0] * L * t, cy = a.y + v[1] * L * t;
      const g = el('g', { class: 'chev', transform: `translate(${f1(cx)},${f1(cy)}) rotate(${ang})`, style: `animation-delay:${(i * .12).toFixed(2)}s` }, gestSvg);
      el('path', { d: 'M-7,-11 L5,0 L-7,11', fill: 'none', stroke: ink(.55), 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
      el('path', { d: 'M-7,-11 L5,0 L-7,11', fill: 'none', stroke: '#faf4e6', 'stroke-width': 2.6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
    }
    el('circle', { class: 'start', cx: a.x, cy: a.y, r: 12, fill: 'none', stroke: SEAL, 'stroke-width': 2 }, gestSvg);
    const trail = el('line', { x1: a.x, y1: a.y, x2: a.x, y2: a.y, stroke: SEAL, 'stroke-width': 5, 'stroke-linecap': 'round' }, gestSvg);
    const head = el('g', { transform: `translate(${a.x},${a.y}) rotate(${ang})` }, gestSvg);
    el('path', { d: 'M-14,-18 L14,0 L-14,18 L-6,0 Z', fill: SEAL, stroke: '#faf4e6', 'stroke-width': 2, 'stroke-linejoin': 'round' }, head);
    gText.textContent = prompt; gPrompt.classList.add('on');

    let p = 0, drag = null, done = false, back = null, keyT = null;
    const keyName = { down: 'ArrowDown', up: 'ArrowUp', right: 'ArrowRight', left: 'ArrowLeft' }[dir];
    const draw = () => {
      const x = a.x + v[0] * L * p, y = a.y + v[1] * L * p;
      trail.setAttribute('x2', f1(x)); trail.setAttribute('y2', f1(y));
      head.setAttribute('transform', `translate(${f1(x)},${f1(y)}) rotate(${ang})`);
    };
    const set = np => { if (done) return; p = clamp(np, 0, 1); onProgress(p); draw(); if (p >= 1) finish(); };
    const springBack = () => { clearInterval(back); back = setInterval(() => { if (p <= 0 || done) { clearInterval(back); return; } set(p - .025); }, 30); };
    const onDown = e => { if (done) return; clearInterval(back); drag = { x: e.clientX, y: e.clientY, p0: p }; };
    const onMove = e => { if (!drag || done) return; set(drag.p0 + ((e.clientX - drag.x) * v[0] + (e.clientY - drag.y) * v[1]) / L); };
    const onUp = () => { if (!drag || done) return; drag = null; springBack(); };
    const onKey = e => { if (e.key !== keyName || keyT || done) return; e.preventDefault(); clearInterval(back); keyT = setInterval(() => set(p + .025), 30); };
    const onKeyUp = e => { if (e.key !== keyName) return; clearInterval(keyT); keyT = null; if (!done) springBack(); };
    const onWheel = e => { const d = Math.abs(e.deltaY) + Math.abs(e.deltaX); clearInterval(back); set(p + d / 1400); };
    function finish() {
      done = true; Cut.cancel = null;
      cutEl.removeEventListener('pointerdown', onDown); cutEl.removeEventListener('pointermove', onMove);
      cutEl.removeEventListener('pointerup', onUp); cutEl.removeEventListener('pointercancel', onUp);
      removeEventListener('keydown', onKey); removeEventListener('keyup', onKeyUp); cutEl.removeEventListener('wheel', onWheel);
      clearInterval(back); clearInterval(keyT);
      gPrompt.classList.remove('on');
      setTimeout(() => { gestSvg.innerHTML = ''; res(); }, Cut.skip ? 0 : 380);
    }
    cutEl.addEventListener('pointerdown', onDown); cutEl.addEventListener('pointermove', onMove);
    cutEl.addEventListener('pointerup', onUp); cutEl.addEventListener('pointercancel', onUp);
    addEventListener('keydown', onKey); addEventListener('keyup', onKeyUp); cutEl.addEventListener('wheel', onWheel, { passive: true });
    Cut.cancel = () => set(1);
    if (Cut.skip) set(1);
  });
}

      P.platform.setAttribute('opacity', f1(a)); P.platform.setAttribute('transform', `translate(0,${f1((1 - a) * 30)})`);
      const k = Math.max(.001, easeOut(seg(p, .2, .5)));
      P.cols.setAttribute('transform', `translate(0,${P.pt}) scale(1,${k.toFixed(3)}) translate(0,${-P.pt})`);
      P.cols.setAttribute('opacity', k > .01 ? 1 : 0);
      P.rails.setAttribute('opacity', f1(seg(p, .42, .6)));
      const r = easeOut(seg(p, .55, .85));
      for (const part of [P.roof, P.top]) part.setAttribute('transform', `translate(0,${f1(-(1 - r) * 200)})`);
      P.roof.setAttribute('opacity', f1(Math.min(1, r * 1.6)));
      P.top.setAttribute('opacity', f1(seg(p, .84, .94)));
      P.plaque.setAttribute('opacity', f1(seg(p, .92, 1)));
      stream.setAttribute('d', `M800,40 L800,${f1(41 + p * 560)}`);
      stream.setAttribute('opacity', f1(p > 0 ? .75 * (1 - seg(p, .9, 1)) : 0));
    };
    build(0);
    return { build, ghost, stamp };
  });
  await say('旁白', '“舣”（yǐ），意为使船靠岸。');
  await say('旁白', '后来，人们为纪念苏轼来常泊舟，在运河边筑起一座亭子。');
  await gesture({ dir: 'down', prompt: '按箭头示意向下缓慢划动 · 筑亭', at: [800, 90], len: 440, onProgress: c.build });
  c.stamp.style.transition = 'opacity .5s'; c.stamp.setAttribute('opacity', 1);
  c.ghost.style.transition = 'opacity 2.4s'; c.ghost.setAttribute('opacity', .32);
  await sleep(600);
  await say('旁白', '这便是舣舟亭，今在常州东坡公园内。', '注：亭为后世纪念建筑，并非苏轼当年所见；画中人影为艺术化表现。');
}
const EPISODES = [
  { run: ep0, title: '<em>壹</em>买田阳羡' },
  { run: ep1, title: '<em>贰</em>夹岸相看' },
  { run: ep2, title: '<em>叁</em>舣舟筑亭' },
];

/* ================= 世界交互 ================= */
const stageEl = document.getElementById('stage');
const hint = document.getElementById('hint');
const card = document.getElementById('card');
const progressLis = [...document.querySelectorAll('#progress li')];
const MINX = 300, MAXX = 3690, MAXV = 5.2;
let state = 'intro', boatX = MINX, boatV = 0, camX = 0, dragging = false, pX = 0, wheelImp = 0, lastRipX = MINX, next = 0, keyDir = 0;
let fishAt = performance.now() + 5000;

stageEl.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  dragging = true; pX = e.clientX; stageEl.classList.add('dragging'); stageEl.setPointerCapture(e.pointerId);
  const wy = e.clientY / s, wx = camX + e.clientX / s;
  if (wy > FAR + 10 && wy < NEAR - 6) for (let k = 0; k < 3; k++) ripple(wx, wy, k * 9, 1.6, .55);
});
stageEl.addEventListener('pointermove', e => { pX = e.clientX; });
const up = () => { dragging = false; stageEl.classList.remove('dragging'); };
stageEl.addEventListener('pointerup', up); stageEl.addEventListener('pointercancel', up);
addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === 'd') keyDir = 1; if (e.key === 'ArrowLeft' || e.key === 'a') keyDir = -1; });
addEventListener('keyup', e => { if (['ArrowRight', 'ArrowLeft', 'a', 'd'].includes(e.key)) keyDir = 0; });
addEventListener('wheel', e => { if (state === 'play') wheelImp = clamp(wheelImp + (e.deltaY + e.deltaX) * .03, -MAXV, MAXV); }, { passive: true });

// 调试 / 演示：地址后加 #ep1 ~ #ep3 可直接跳到对应剧情前
function jumpTo(i) {
  for (let j = 0; j < i; j++) {
    const n = NODES[j];
    n.live.removeAttribute('mask'); n.ghost.remove(); n.marker.style.opacity = 0;
    progressLis[j].classList.add('done');
  }
  next = i; boatX = NODES[i].trig - 90; camX = NaN;
}
document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('intro').classList.add('open');
  const m = location.hash.match(/^#ep([1-3])$/);
  if (m) jumpTo(+m[1] - 1);
  setTimeout(() => { state = 'play'; hint.classList.remove('hide'); }, 900);
  setTimeout(() => document.getElementById('intro').style.display = 'none', 1700);
});
document.getElementById('againBtn').addEventListener('click', () => location.reload());

async function triggerNode(i) {
  state = 'cut'; keyDir = 0; up(); hint.classList.add('hide'); card.classList.remove('show');
  const n = NODES[i];
  n.marker.style.transition = 'opacity .4s'; n.marker.style.opacity = 0;
  await inkCover((n.cx - camX) * s, 360 * s);
  hud.style.opacity = 0;
  document.getElementById('cutTitle').innerHTML = EPISODES[i].title;
  cutEl.classList.add('on');
  Cut.skip = false; Cut.first = true;
  await EPISODES[i].run();
  dlg.classList.remove('show');
  await inkCover(innerWidth / 2, innerHeight / 2);
  cutEl.classList.remove('on');
  if (Cut.layer) { Cut.layer.remove(); Cut.layer = null; }
  Cut.skip = false;
  hud.style.opacity = 1;
  await inkUncover();
  reveal(i);
}

function reveal(i) {
  const n = NODES[i];
  const t0 = performance.now(), dur = 2100;
  (function step(t) {
    const k = clamp((t - t0) / dur, 0, 1);
    for (const c of n.circles) c.c.setAttribute('r', f1(c.max * easeOut(clamp((t - t0 - c.delay) / dur, 0, 1))));
    n.ghost.setAttribute('opacity', f1(.075 * (1 - k)));
    if (k < 1) tick(step);
    else { n.live.removeAttribute('mask'); n.ghost.remove(); }
  })(t0);
  setTimeout(() => {
    document.getElementById('cardSeal').textContent = n.seal;
    document.getElementById('cardTitle').textContent = n.title;
    document.getElementById('cardText').textContent = n.text;
    document.getElementById('cardNote').textContent = n.note;
    card.classList.add('show');
  }, 600);
  const d = document.createElement('div'); d.className = 'drop';
  d.style.left = ((n.cx - camX) * s) + 'px'; d.style.top = (360 * s) + 'px';
  document.body.appendChild(d);
  const r = progressLis[i].querySelector('i').getBoundingClientRect();
  setTimeout(() => {
    d.style.left = (r.left + r.width / 2) + 'px'; d.style.top = (r.top + r.height / 2) + 'px';
    d.style.transform = 'scale(.6)'; d.style.opacity = 0;
  }, 40);
  setTimeout(() => { progressLis[i].classList.add('done'); d.remove(); }, 1000);
  if (i === NODES.length - 1) {
    state = 'moor';
    setTimeout(() => { card.classList.remove('show'); document.getElementById('ending').classList.add('show'); state = 'end'; }, 5200);
  } else state = 'play';
}

let last = performance.now();
function frame(t) {
  const dt = Math.min(50, t - last) / 16.667; last = t;
  let want = 0;
  if (state === 'play') {
    if (dragging) want = clamp(((camX + pX / s) - boatX) * .05, -MAXV, MAXV);
    if (keyDir) want = keyDir * MAXV;
    want = clamp(want + wheelImp, -MAXV, MAXV);
  } else if (state === 'moor') {
    want = clamp((MAXX - boatX) * .03, -2, 2);
  }
  wheelImp *= Math.pow(.9, dt);
  boatV += (want - boatV) * .07 * dt;
  if (state === 'cut') boatV *= .8;
  boatX = clamp(boatX + boatV * dt, MINX, MAXX);
  if (boatX === MAXX || boatX === MINX) boatV *= .8;

  if (state === 'play' && next < NODES.length && boatX >= NODES[next].trig) triggerNode(next++);
  if (boatX > MINX + 160) hint.classList.add('hide');

  const camT = clamp(boatX - VW * .36, 0, Math.max(0, W - VW));
  camX = Number.isFinite(camX) ? camX + (camT - camX) * .06 * dt : camT;

  for (const L of Object.values(LAYERS)) L.div.style.transform = `translate3d(${-camX * L.f * s}px,0,0)`;
  const bob = Math.sin(t * .0021) * 2.6;
  const tilt = clamp(boatV * .5, -2.5, 2.5) + Math.sin(t * .0016) * .8;
  boatDiv.style.transform = `translate3d(${(boatX - camX - BW / 2) * s}px,${(WATER + bob - BWL) * s}px,0) rotate(${tilt}deg)`;

  // 船尾涟漪
  if (Math.abs(boatX - lastRipX) > 28 && Math.abs(boatV) > .4) {
    lastRipX = boatX;
    ripple(boatX - Math.sign(boatV) * 105, WATER + 8);
  }
  // 跃鱼
  if (state === 'play' && t > fishAt) {
    fishAt = t + 6000 + Math.random() * 6000;
    const x0 = boatX + 220 + Math.random() * 380, y0 = FAR + 50 + Math.random() * (NEAR - FAR - 100);
    const e = el('path', { d: 'M-13,0 Q-2,-7 10,-1 L16,-6 L14,0 L16,6 L10,1 Q-2,7 -13,0 Z', fill: ink(.85) }, FX);
    fishes.push({ x0, y0, t0: t, e });
    ripple(x0, y0 + 4, 0, 1.3, .5);
  }
  for (let i = fishes.length - 1; i >= 0; i--) {
    const f = fishes[i], k = (t - f.t0) / 900;
    if (k >= 1) { f.e.remove(); fishes.splice(i, 1); ripple(f.x0 + 70, f.y0 + 4, 0, 1.4, .55); ripple(f.x0 + 70, f.y0 + 4, 8, 1.4, .4); continue; }
    const x = f.x0 + k * 70, y = f.y0 - Math.sin(k * Math.PI) * 58;
    const ang = Math.atan2(-58 * Math.PI * Math.cos(k * Math.PI), 70) * 180 / Math.PI;
    f.e.setAttribute('transform', `translate(${f1(x)},${f1(y)}) rotate(${f1(ang)})`);
  }
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    if (r.d > 0) { r.d -= dt; continue; }
    if (!r.e) r.e = el('ellipse', { cx: f1(r.x), cy: f1(r.y), rx: 8, ry: 2.2, 'stroke-width': 1.2 }, rippleG);
    r.rx += r.grow * dt; r.ry += r.grow * .2 * dt; r.o -= .007 * dt;
    if (r.o <= 0) { r.e.remove(); ripples.splice(i, 1); continue; }
    r.e.setAttribute('rx', f1(r.rx)); r.e.setAttribute('ry', f1(r.ry)); r.e.setAttribute('stroke', ink(f1(r.o)));
  }
  tick(frame);
}
tick(frame);
})();
</script>
