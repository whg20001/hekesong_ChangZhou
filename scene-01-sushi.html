<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>行舟入墨 · 苏轼 × 舣舟亭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#efe7d6; --paper-hi:#f7f1e4; --paper-lo:#e3d8c1;
  --ink:#1c1b19; --ink-2:#3a3833; --ink-soft:rgba(28,27,25,.55);
  --seal:#b03a2e; --gold:#e3bf63; --bar:#16140f;
  --brush:"Ma Shan Zheng","STXingkai","STKaiti","KaiTi",serif;
  --serif:"Noto Serif SC","Songti SC","SimSun",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--serif)}
button{font:inherit;color:inherit}

/* ---------- 场景层 ---------- */
#stage{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#stage.dragging{cursor:grabbing}
#sky{position:absolute;inset:0;background:
  radial-gradient(ellipse 70% 55% at 50% 28%, var(--paper-hi) 0%, transparent 70%),
  linear-gradient(180deg,#ece3cf 0%,var(--paper) 45%,#e8dfcb 100%)}
.layer{position:absolute;left:0;top:0;will-change:transform}
.layer svg{display:block;overflow:visible}
#boat{position:absolute;left:0;top:0;will-change:transform;transform-origin:50% 56%}
#boat svg{display:block;overflow:visible}
#grain{position:fixed;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.5;z-index:25}
#vignette{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(ellipse at center, transparent 52%, rgba(92,66,32,.20) 100%)}

.marker .ring{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
.marker .ring.r2{animation-delay:1.1s}
@keyframes pulse{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.marker .dot{transform-box:fill-box;transform-origin:center;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;
  padding:18px 22px;pointer-events:none;z-index:5;transition:opacity .6s}
.chapter{display:flex;gap:12px;align-items:center}
.seal-sm{width:34px;height:34px;display:grid;place-items:center;background:var(--seal);color:var(--paper-hi);
  font-family:var(--brush);font-size:22px;border-radius:3px;box-shadow:inset 0 0 0 2px rgba(255,240,220,.25)}
.chapter b{display:block;font-family:var(--brush);font-weight:400;font-size:26px;letter-spacing:.12em;line-height:1}
.chapter small{display:block;margin-top:5px;font-size:12px;letter-spacing:.18em;color:var(--ink-soft)}
#progress{list-style:none;display:flex;gap:18px;margin-top:4px}
#progress li{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;letter-spacing:.2em;color:var(--ink-soft)}
#progress i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink-soft);transition:background .6s,border-color .6s,transform .6s}
#progress li.done i{background:var(--ink);border-color:var(--ink);transform:scale(1.15)}
#progress li.done{color:var(--ink)}

/* ---------- 故事卡 ---------- */
#card{position:fixed;left:24px;top:92px;width:min(380px,calc(100vw - 32px));z-index:6;
  background:rgba(247,241,228,.93);border:1px solid rgba(28,27,25,.28);
  box-shadow:0 10px 30px rgba(60,40,10,.12), inset 0 0 0 5px rgba(247,241,228,.93), inset 0 0 0 6px rgba(28,27,25,.15);
  padding:22px 24px 20px 24px;opacity:0;transform:translateY(16px);filter:blur(6px);
  transition:opacity .8s ease, transform .8s ease, filter .8s ease;pointer-events:none}
#card.show{opacity:1;transform:none;filter:none}
#card .seal{position:absolute;right:18px;top:-14px;width:40px;height:40px;display:grid;place-items:center;
  background:var(--seal);color:var(--paper-hi);font-family:var(--brush);font-size:26px;border-radius:3px;transform:rotate(-4deg)}
#card h2{font-family:var(--brush);font-weight:400;font-size:32px;letter-spacing:.14em;margin-bottom:8px}
#card p{font-size:15px;line-height:1.95;color:var(--ink-2);text-align:justify}
#card small{display:block;margin-top:10px;font-size:12px;color:var(--ink-soft);letter-spacing:.05em}
#card small:empty{display:none}

#hint{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:6;text-align:center;
  font-size:15px;letter-spacing:.2em;color:var(--ink-2);pointer-events:none;transition:opacity .8s}
#hint .arrow{display:inline-block;font-family:var(--brush);font-size:22px;animation:nudge 1.4s ease-in-out infinite}
#hint small{display:block;margin-top:4px;font-size:12px;color:var(--ink-soft);letter-spacing:.15em}
@keyframes nudge{50%{transform:translateX(8px)}}
#hint.hide{opacity:0}

#foot{position:fixed;right:18px;bottom:12px;font-size:11px;letter-spacing:.12em;color:var(--ink-soft);z-index:5;pointer-events:none}

.drop{position:fixed;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50% 46% 52% 48%;background:var(--ink);
  z-index:7;pointer-events:none;transition:left .95s cubic-bezier(.6,.05,.3,1), top .95s cubic-bezier(.6,.05,.3,1), transform .95s, opacity .3s .9s;
  box-shadow:0 0 0 3px rgba(28,27,25,.12)}

/* ---------- 剧情演出 ---------- */
#cut{position:fixed;inset:0;z-index:20;display:none;background:var(--paper);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
#cut.on{display:block}
#cutSvg{position:absolute;inset:0;width:100%;height:100%;display:block}
#cut .bar{position:absolute;left:0;right:0;height:8vh;min-height:44px;background:var(--bar);display:flex;align-items:center;
  justify-content:space-between;padding:0 24px;color:rgba(239,231,214,.75);z-index:2}
#cut .bar.top{top:0}
#cut .bar.bot{bottom:0;justify-content:center}
#cutTitle{font-family:var(--brush);font-size:22px;letter-spacing:.25em}
#cutTitle em{font-style:normal;color:var(--gold);margin-right:10px}
#skipBtn{background:transparent;border:1px solid rgba(239,231,214,.35);color:rgba(239,231,214,.8);padding:4px 14px;
  font-size:13px;letter-spacing:.2em;cursor:pointer;border-radius:2px}
#skipBtn:hover{border-color:var(--gold);color:var(--gold)}
#gPrompt{display:flex;gap:10px;align-items:center;font-size:14px;letter-spacing:.18em;color:#efe7d6;opacity:0;transition:opacity .4s}
#gPrompt.on{opacity:1}
.mouse{width:14px;height:21px;border:1.5px solid currentColor;border-radius:7px;position:relative;flex:none}
.mouse::after{content:'';position:absolute;left:50%;top:3px;width:2px;height:5px;margin-left:-1px;background:var(--gold);border-radius:1px}
#gest{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
#gest .chev{animation:chev 1.3s ease-in-out infinite}
@keyframes chev{0%,100%{opacity:.25}50%{opacity:1}}
#gest .start{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
#dlg{position:absolute;left:50%;bottom:calc(max(8vh,44px) + 14px);transform:translateX(-50%);width:min(900px,calc(100vw - 32px));
  text-align:center;opacity:0;transition:opacity .35s;pointer-events:none;z-index:4}
#dlg.show{opacity:1}
#dlg .who{font-family:var(--brush);font-size:30px;color:var(--seal);letter-spacing:.25em;line-height:1.1;
  text-shadow:0 0 8px var(--paper-hi),0 0 16px var(--paper-hi)}
#dlg.narr .who{display:none}
#dlg .line{display:inline-block;margin-top:6px;padding:10px 60px;font-size:20px;line-height:1.8;color:var(--ink);
  background:linear-gradient(90deg,transparent,rgba(247,241,228,.94) 14%,rgba(247,241,228,.94) 86%,transparent)}
#dlg.narr .line{color:var(--ink-2);font-size:18px}
#dlg .note{font-size:13px;color:var(--ink-soft);margin-top:2px;min-height:1em;text-shadow:0 0 6px var(--paper-hi)}
#dlg .more{font-size:12px;color:var(--ink-soft);opacity:0;height:14px}
#dlg.ready .more{opacity:1;animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.breath{transform-box:fill-box;transform-origin:50% 100%;animation:breath 4.5s ease-in-out infinite}
@keyframes breath{50%{transform:scale(1.004,1.01)}}

#ink{position:fixed;left:0;top:0;width:600px;height:600px;margin:-300px 0 0 -300px;pointer-events:none;z-index:30;
  transform:scale(0);opacity:1;will-change:transform,opacity}
#ink svg{display:block;width:600px;height:600px;overflow:visible}

/* ---------- 开场 ---------- */
#intro{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:var(--paper);
  clip-path:inset(0 0 0 0);transition:clip-path 1.6s cubic-bezier(.7,0,.2,1)}
#intro.open{clip-path:inset(0 50% 0 50%)}
#intro .rod{position:absolute;top:0;bottom:0;width:14px;background:linear-gradient(90deg,#5a3d22,#8b6236 45%,#4a301a);opacity:.9}
#intro .rod.l{left:0}#intro .rod.r{right:0}
#intro .inner{display:flex;gap:44px;align-items:center}
#intro h1{writing-mode:vertical-rl;font-family:var(--brush);font-weight:400;font-size:clamp(64px,11vh,108px);letter-spacing:.18em;line-height:1}
#intro .meta{writing-mode:vertical-rl;font-size:15px;letter-spacing:.4em;color:var(--ink-soft);line-height:2.2}
#intro .meta em{font-style:normal;color:var(--seal)}
#startBtn{width:86px;height:86px;border:none;border-radius:4px;background:var(--seal);color:var(--paper-hi);
  font-family:var(--brush);font-size:30px;letter-spacing:.1em;cursor:pointer;box-shadow:inset 0 0 0 3px rgba(255,240,220,.3);
  transform:rotate(-3deg);transition:transform .25s}
#startBtn:hover{transform:rotate(0) scale(1.06)}

/* ---------- 结尾 ---------- */
#ending{position:fixed;left:24px;top:92px;z-index:9;pointer-events:none;opacity:0;transition:opacity 1.2s}
#ending.show{opacity:1;pointer-events:auto}
#ending .panel{position:relative;width:min(400px,calc(100vw - 32px));background:rgba(247,241,228,.95);
  border:1px solid rgba(28,27,25,.3);padding:34px 32px 26px;text-align:center;
  box-shadow:0 20px 60px rgba(60,40,10,.18), inset 0 0 0 6px rgba(247,241,228,.95), inset 0 0 0 7px rgba(28,27,25,.14)}
#ending .stamp{width:92px;height:92px;margin:0 auto 18px;display:grid;place-items:center;background:var(--seal);color:var(--paper-hi);
  font-family:var(--brush);font-size:38px;line-height:1;writing-mode:vertical-rl;letter-spacing:.05em;border-radius:4px;
  box-shadow:inset 0 0 0 4px rgba(255,240,220,.28);transform:scale(2.2) rotate(-12deg);opacity:0;transition:transform .5s cubic-bezier(.3,1.6,.5,1) .4s, opacity .2s .4s}
#ending.show .stamp{transform:scale(1) rotate(-4deg);opacity:1}
#ending p{font-size:16px;line-height:2;color:var(--ink-2)}
#ending .got{margin-top:12px;font-size:13px;color:var(--ink-soft);letter-spacing:.1em}
#ending .got b{color:var(--ink);font-weight:600}
#ending .btns{display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap}
#ending button{padding:10px 18px;border:1px solid var(--ink);background:transparent;cursor:pointer;letter-spacing:.15em;font-size:14px}
#ending button.primary{background:var(--ink);color:var(--paper-hi)}
#ending button:disabled{opacity:.45;cursor:not-allowed}
#ending .grades{display:flex;justify-content:center;gap:14px;margin:14px 0 4px}
#ending .grades div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;letter-spacing:.15em;color:var(--ink-soft)}
#ending .grades b{width:40px;height:40px;display:grid;place-items:center;background:var(--seal);color:var(--paper-hi);
  font-family:var(--brush);font-weight:400;font-size:24px;border-radius:3px}
#ending .grades b.none{background:transparent;color:var(--ink-soft);border:1px dashed var(--ink-soft)}

/* ---------- 墨韵 / 图鉴 / 提示 ---------- */
.hud-r{display:flex;gap:20px;align-items:flex-start}
#inkMeter{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;letter-spacing:.2em;color:var(--ink-soft)}
#inkMeter .v{display:flex;align-items:center;gap:6px;font-family:var(--brush);font-size:24px;color:var(--ink);letter-spacing:0;line-height:1}
#inkMeter svg{width:14px;height:18px}
#inkMeter.bump .v{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.25)}}
#bookBtn{pointer-events:auto;border:1px solid rgba(28,27,25,.35);background:rgba(247,241,228,.75);padding:6px 10px;
  font-size:12px;letter-spacing:.18em;cursor:pointer;margin-top:2px}
#bookBtn:hover{border-color:var(--ink)}
.toast{position:fixed;z-index:8;pointer-events:none;font-family:var(--brush);font-size:22px;color:var(--ink);white-space:nowrap;
  text-shadow:0 0 6px var(--paper-hi),0 0 10px var(--paper-hi);transform:translate(-50%,-50%);animation:rise 1.3s ease-out forwards}
.toast.bad{color:var(--seal)}
@keyframes rise{to{transform:translate(-50%,-160%);opacity:0}}
#banner{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:8;background:rgba(247,241,228,.95);
  border:1px solid rgba(28,27,25,.25);padding:8px 20px;font-size:14px;letter-spacing:.12em;color:var(--ink-2);
  opacity:0;transition:opacity .5s;pointer-events:none;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
#banner.show{opacity:1}
#poem{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:6;background:rgba(247,241,228,.93);
  border:1px solid rgba(28,27,25,.28);padding:10px 22px 12px;text-align:center;opacity:0;transition:opacity .6s;pointer-events:none}
#poem.show{opacity:1}
#poem small{display:block;font-size:12px;letter-spacing:.2em;color:var(--ink-soft);margin-bottom:4px}
#poem .ln{font-family:var(--brush);font-size:clamp(18px,3.2vw,26px);letter-spacing:.1em;white-space:nowrap}
#poem .slot{display:inline-block;width:1.15em;border-bottom:2px dashed var(--seal);color:var(--seal);text-align:center}
#poem .slot.ok{border-bottom-color:transparent;animation:bump .4s}
#rain{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;
  background:repeating-linear-gradient(104deg,transparent 0 22px,rgba(28,27,25,.13) 22px 23px,transparent 23px 47px);
  background-size:240px 240px;animation:rainfall .45s linear infinite}
@keyframes rainfall{to{background-position:-60px 240px}}
#book{position:fixed;inset:0;z-index:35;background:rgba(22,20,15,.55);display:none;place-items:center}
#book.on{display:grid}
#book .panel{width:min(760px,calc(100vw - 32px));max-height:calc(100vh - 48px);overflow:auto;background:var(--paper-hi);
  border:1px solid rgba(28,27,25,.3);padding:24px 26px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
#book h3{font-family:var(--brush);font-weight:400;font-size:30px;letter-spacing:.15em;display:flex;justify-content:space-between;align-items:center}
#book h3 button{font-family:var(--serif);font-size:13px;letter-spacing:.15em;border:1px solid var(--ink-soft);background:none;padding:4px 12px;cursor:pointer}
#book .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:16px}
#book .c{border:1px solid rgba(28,27,25,.25);padding:14px 14px 12px;background:rgba(239,231,214,.5);min-height:132px;position:relative}
#book .c i{position:absolute;right:10px;top:10px;width:28px;height:28px;display:grid;place-items:center;background:var(--seal);
  color:var(--paper-hi);font-style:normal;font-family:var(--brush);font-size:18px;border-radius:2px}
#book .c b{display:block;font-family:var(--brush);font-weight:400;font-size:22px;margin-bottom:6px;padding-right:34px}
#book .c p{font-size:13px;line-height:1.8;color:var(--ink-2)}
#book .c.lock{background:repeating-linear-gradient(45deg,rgba(28,27,25,.03) 0 6px,transparent 6px 12px)}
#book .c.lock i{background:var(--ink-soft)}
#book .c.lock p,#book .c.lock b{color:var(--ink-soft)}

/* ---------- 剧情内小游戏 ---------- */
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
#choice{position:absolute;left:50%;bottom:calc(max(8vh,44px) + 130px);transform:translateX(-50%);display:none;gap:16px;z-index:5}
#choice.on{display:flex}
#choice button{min-width:200px;padding:14px 22px;background:rgba(247,241,228,.96);border:1px solid var(--ink);cursor:pointer;
  font-size:16px;letter-spacing:.12em;box-shadow:0 6px 18px rgba(60,40,10,.15);transition:background .2s,color .2s}
#choice button:hover{background:var(--ink);color:var(--paper-hi)}
#result{position:absolute;inset:0;display:none;place-items:center;z-index:6;background:rgba(239,231,214,.45)}
#result.on{display:grid}
#result .panel{width:min(420px,calc(100vw - 32px));background:rgba(247,241,228,.97);border:1px solid rgba(28,27,25,.3);
  padding:28px 30px 24px;text-align:center;box-shadow:0 20px 60px rgba(60,40,10,.2)}
#result .g{width:96px;height:96px;margin:0 auto 14px;display:grid;place-items:center;background:var(--seal);color:var(--paper-hi);
  font-family:var(--brush);font-size:58px;border-radius:4px;transform:rotate(-5deg);box-shadow:inset 0 0 0 4px rgba(255,240,220,.3);animation:stamp .5s cubic-bezier(.3,1.6,.5,1)}
#result .g.none{background:transparent;color:var(--ink-soft);border:2px dashed var(--ink-soft);font-size:30px}
@keyframes stamp{from{transform:scale(2.2) rotate(-14deg);opacity:0}}
#result h3{font-family:var(--brush);font-weight:400;font-size:26px;letter-spacing:.15em}
#result ul{list-style:none;margin:10px 0 18px;font-size:14px;line-height:2;color:var(--ink-2)}
#result button{padding:9px 26px;border:1px solid var(--ink);background:var(--ink);color:var(--paper-hi);cursor:pointer;letter-spacing:.2em}
#rhythm{position:absolute;left:50%;bottom:calc(max(8vh,44px) + 40px);transform:translateX(-50%);width:min(640px,calc(100vw - 32px));
  height:70px;display:none;z-index:4;background:linear-gradient(90deg,transparent,rgba(247,241,228,.9) 10%,rgba(247,241,228,.9) 90%,transparent)}
#rhythm.on{display:block}
#rhythm .track{position:absolute;left:4%;right:4%;top:50%;height:2px;background:rgba(28,27,25,.3)}
#rhythm .ring{position:absolute;left:18%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;border:3px solid var(--seal);
  box-shadow:0 0 0 6px rgba(176,58,46,.12)}
#rhythm .note{position:absolute;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:var(--paper-hi);
  border:2px solid var(--ink);display:grid;place-items:center;font-size:24px;font-weight:600;color:var(--ink);transition:opacity .25s,transform .25s}
#rhythm .note.down{border-color:var(--seal);color:var(--seal);width:52px;height:52px;margin:-26px}
#rhythm .note.hit{opacity:0;transform:scale(1.6)}
#rhythm .note.miss{opacity:.15}
#rhythm .judge{position:absolute;left:18%;top:-26px;transform:translateX(-50%);font-family:var(--brush);font-size:32px;
  pointer-events:none;animation:rise 1s ease-out forwards}
#rhythm .judge.p{color:var(--seal)} #rhythm .judge.g{color:var(--ink)} #rhythm .judge.m{color:var(--ink-soft)}
#rhythm .count{position:absolute;left:50%;top:-50px;transform:translateX(-50%);font-family:var(--brush);font-size:40px;color:var(--seal)}
#tray{position:absolute;left:20px;top:calc(max(8vh,44px) + 16px);bottom:calc(max(8vh,44px) + 16px);width:150px;display:none;
  flex-direction:column;gap:8px;z-index:5;overflow:auto}
#tray.on{display:flex}
.part{background:rgba(247,241,228,.96);border:1px solid rgba(28,27,25,.35);padding:6px 6px 4px;display:flex;flex-direction:column;
  align-items:center;gap:2px;cursor:grab;touch-action:none;user-select:none;transition:opacity .3s,transform .3s}
.part svg{width:120px;height:52px;pointer-events:none}
.part span{font-size:13px;letter-spacing:.2em}
.part.used{opacity:.22;pointer-events:none}
.part.shake{animation:shake .4s}
.part.ghost{position:fixed;z-index:26;pointer-events:none;width:132px;transform:translate(-50%,-50%) rotate(-3deg);box-shadow:0 10px 24px rgba(0,0,0,.2)}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
#asmTip{position:absolute;left:50%;top:calc(max(8vh,44px) + 16px);transform:translateX(-50%);z-index:5;display:none;
  background:rgba(247,241,228,.95);border:1px solid rgba(28,27,25,.25);padding:8px 18px;font-size:15px;letter-spacing:.08em;max-width:min(560px,70vw);text-align:center}
#asmTip.on{display:block}
#asmTip.bad{color:var(--seal)}

/* ---------- 尾声 CG ---------- */
#cg{position:fixed;inset:0;z-index:24;display:none;background:#efe7d6;transition:opacity .8s}
#cg.on{display:block}
#cgStage{position:absolute;inset:0;overflow:hidden;background:#efe7d6}
#cg .shot{position:absolute;inset:0;overflow:hidden}
#cg .lyr{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transform-origin:50% 50%;will-change:transform}
#cg .moonring{position:absolute;left:50%;top:50%;width:1000px;height:1000px;pointer-events:none;will-change:transform}
#cg .moonring svg{width:100%;height:100%;display:block}
#cg .bar{position:absolute;left:0;right:0;height:9vh;min-height:46px;background:var(--bar);display:flex;align-items:center;
  justify-content:space-between;padding:0 24px;color:rgba(239,231,214,.7);z-index:3}
#cg .bar.top{top:0}
#cg .bar.bot{bottom:0;justify-content:center}
#cg .bar.top span{font-family:var(--brush);font-size:20px;letter-spacing:.3em}
#cgSkip{background:transparent;border:1px solid rgba(239,231,214,.35);color:rgba(239,231,214,.8);padding:4px 14px;font-size:13px;letter-spacing:.2em;cursor:pointer}
#cgSkip:hover{border-color:var(--gold);color:var(--gold)}
#cgSub{font-size:clamp(15px,2vw,20px);letter-spacing:.2em;color:#f3ecdc;text-shadow:0 0 8px #000}
#cgFlash{position:absolute;inset:0;background:#fffdf6;opacity:0;pointer-events:none;z-index:2}
#cgTitle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;text-align:center;opacity:0;transition:opacity 1.4s;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(22,20,15,.82) 0%,rgba(22,20,15,.6) 55%,rgba(22,20,15,0) 75%);padding:40px 80px;white-space:nowrap}
#cgTitle.on{opacity:1}
#cgTitle b{display:block;font-family:var(--brush);font-weight:400;font-size:clamp(40px,7vw,84px);letter-spacing:.2em;color:#f3ecdc;
  text-shadow:0 0 18px rgba(0,0,0,.6),0 0 2px #000}
#cgTitle span{display:inline-block;margin-top:10px;padding:6px 14px;border-top:1px solid rgba(243,236,220,.4);color:#f3ecdc;font-size:clamp(12px,1.6vw,16px);letter-spacing:.2em}
#cgTitle span em{font-style:normal;color:var(--gold)}

@media (max-width:640px){
  #hud{padding:12px 14px}
  .chapter b{font-size:20px}
  .chapter small{display:none}
  #progress{gap:10px}
  #card{left:16px;top:auto;bottom:16px;padding:18px 18px 16px}
  #ending{left:16px;top:auto;bottom:16px}
  #card h2{font-size:26px}
  #card p{font-size:14px}
  #foot{display:none}
  #dlg .who{font-size:24px}
  #dlg .line{font-size:16px;padding:8px 24px}
  #cutTitle{font-size:17px}
}

function smooth(pts) {

const CHANG = [

function densify(pts, step) {
  const out = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], n = Math.max(1, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1]) / step));
    for (let k = 1; k <= n; k++) out.push([a[0] + (b[0] - a[0]) * k / n, a[1] + (b[1] - a[1]) * k / n]);
  }
  return out;
}
function trace({ ox, oy, size, strokes, inkF, label }) {
  return new Promise(res => {
    const g = el('g', {}, Cut.layer);
    const S = size / 300, W0 = 17 * S, tol = 24 * S, red = 'rgba(176,58,46,.35)';
    el('rect', { x: ox - 22, y: oy - 22, width: size + 44, height: size + 44, fill: ink(.1), transform: 'translate(8,8)' }, g);
    el('rect', { x: ox - 22, y: oy - 22, width: size + 44, height: size + 44, fill: '#f8f3e6', stroke: ink(.4) }, g);
    el('rect', { x: ox, y: oy, width: size, height: size, fill: 'none', stroke: red, 'stroke-width': 2 }, g);
    el('path', { d: `M${ox},${oy}L${ox + size},${oy + size}M${ox + size},${oy}L${ox},${oy + size}M${ox + size / 2},${oy}V${oy + size}M${ox},${oy + size / 2}H${ox + size}`,
      stroke: red, 'stroke-width': 1, 'stroke-dasharray': '6 6', fill: 'none' }, g);
    const SS = strokes.map(st => densify(st.map(p => [ox + p[0] * S, oy + p[1] * S]), 4));
    for (const pts of SS) el('path', { d: taper(pts, W0 * 1.15, W0 * .8), fill: 'rgba(176,58,46,.17)' }, g);
    const inkA = f1(.5 + .45 * inkF);
    const done = el('g', { fill: ink(inkA) }, g);
    const blots = el('g', { fill: ink(.5), filter: 'url(#fBleed)' }, g);
    const live = el('path', { fill: ink(inkA) }, g);
    const guide = el('path', { fill: 'none', stroke: 'rgba(176,58,46,.8)', 'stroke-width': 2, 'stroke-dasharray': '4 6' }, g);
    const ring = el('circle', { r: 10 * S, fill: 'none', stroke: SEAL, 'stroke-width': 2, class: 'pulse' }, g);
    const dot = el('circle', { r: 7 * S, fill: SEAL }, g);
    const num = el('text', { 'font-size': 18 * S, fill: SEAL, 'font-family': BRUSH, 'text-anchor': 'middle' }, g);
    let si = 0, k = 0, tracing = false, errors = 0, lifts = 0, keyT = null, finished = false;
    const setGuide = () => {
      const pts = SS[si];
      guide.setAttribute('d', 'M' + pts.map(p => `${f1(p[0])},${f1(p[1])}`).join('L'));
      for (const c of [ring, dot]) { c.setAttribute('cx', f1(pts[0][0])); c.setAttribute('cy', f1(pts[0][1])); }
      num.setAttribute('x', f1(pts[0][0] - 20 * S)); num.setAttribute('y', f1(pts[0][1] - 8 * S)); num.textContent = si + 1;
      live.setAttribute('d', '');
      gText.textContent = `${label} · 第 ${si + 1} / ${SS.length} 笔（从红点起笔，沿红线描）`;
    };
    const drawLive = () => { if (k >= 1) live.setAttribute('d', taper(SS[si].slice(0, k + 1), W0 * 1.2, W0 * .85)); };
    const strokeDone = () => {
      el('path', { d: taper(SS[si], W0 * 1.2, W0 * .72, .06) }, done);
      live.setAttribute('d', ''); si++; k = 0; tracing = false;
      if (si >= SS.length) finish(false); else setGuide();
    };
    const advanceTo = p => {
      const pts = SS[si];
      let best = -1, minD = 1e9;
      for (let j = Math.max(0, k - 3); j < Math.min(pts.length, k + 16); j++) {
        const d = Math.hypot(p[0] - pts[j][0], p[1] - pts[j][1]);
        minD = Math.min(minD, d);
        if (d < tol && j > best) best = j;
      }
      if (best > k) { k = best; drawLive(); }

    };

    };
    const onKeyUp = e => { if (isKey(e)) { clearInterval(keyT); keyT = null; } };

      if (finished) return; finished = true; clearInterval(keyT);

      cutEl.removeEventListener('pointerup', onUp); cutEl.removeEventListener('pointercancel', onUp);
      removeEventListener('keydown', onKey); removeEventListener('keyup', onKeyUp);

    }

    cutEl.addEventListener('pointerup', onUp); cutEl.addEventListener('pointercancel', onUp);
    addEventListener('keydown', onKey); addEventListener('keyup', onKeyUp);
    dlg.classList.remove('show'); gPrompt.classList.add('on'); setGuide();
    Cut.cancel = () => finish(true);
    if (Cut.skip) finish(true);
  });
}

// —— 节奏摇橹：音符滑向判定圈，按节拍左右划；↓ 为放低船篷过桥洞 ——
function rhythm({ beats, interval, onJudge, onFrame }) {
  return new Promise(res => {
    const box = document.getElementById('rhythm');
    box.innerHTML = '<div class="track"></div><div class="ring"></div><div class="count" id="rCount"></div>';
    box.classList.add('on'); dlg.classList.remove('show');
    const notes = beats.map((d, i) => {
      const n = document.createElement('div');
      n.className = 'note' + (d === 'D' ? ' down' : '');
      n.textContent = d === 'L' ? '←' : d === 'R' ? '→' : '↓';
      n.style.left = '110%'; box.appendChild(n);
      return { d, t: i * interval, el: n, done: false };
    });
    const lead = 2400, travel = 1700, t0 = performance.now() + lead;
    let finished = false, perfect = 0, good = 0, miss = 0, swipe = null;
    gText.textContent = '按节拍左右划动摇橹（← →）· 过桥洞时向下划（↓）放低船篷';
    gPrompt.classList.add('on');
    const judgeEl = (txt, cls) => {
      const j = document.createElement('div'); j.className = 'judge ' + cls; j.textContent = txt;
      box.appendChild(j); setTimeout(() => j.remove(), 1000);
    };
    const mark = (n, q) => {
      n.done = true; n.el.classList.add(q ? 'hit' : 'miss');
      if (q === 1) { perfect++; judgeEl('妙', 'p'); } else if (q) { good++; judgeEl('好', 'g'); } else { miss++; judgeEl('失', 'm'); }
      onJudge(n, q);
    };
    const hit = dir => {
      if (finished) return;
      const now = performance.now() - t0;
      const n = notes.find(n => !n.done && Math.abs(now - n.t) <= 270);
      if (!n) return;
      if (n.d !== dir) return mark(n, 0);
      mark(n, Math.abs(now - n.t) <= 120 ? 1 : .7);
    };
    const loop = () => {
      if (finished) return;
      const now = performance.now() - t0;
      const cd = document.getElementById('rCount');
      if (cd) cd.textContent = now < -1600 ? '预备' : now < -800 ? '二' : now < 0 ? '一' : '';
      for (const n of notes) {
        if (n.done) continue;
        if (now - n.t > 270) { mark(n, 0); continue; }
        n.el.style.left = f1(18 + (n.t - now) / travel * 82) + '%';
      }
      onFrame && onFrame();
      if (notes.every(n => n.done)) { finished = true; setTimeout(() => finish(false), 600); return; }
      tick(loop);
    };
    const keyMap = { ArrowLeft: 'L', ArrowRight: 'R', ArrowDown: 'D', a: 'L', d: 'R', s: 'D' };
    const onKey = e => { const d = keyMap[e.key]; if (d && !e.repeat) { e.preventDefault(); hit(d); } };
    const onDown = e => { swipe = { x: e.clientX, y: e.clientY }; };
    const onUp = e => {
      if (!swipe) return;
      const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y; swipe = null;
      if (dy > 30 && dy > Math.abs(dx)) hit('D');
      else if (Math.abs(dx) > 30) hit(dx > 0 ? 'R' : 'L');
      else hit(e.clientX < innerWidth / 2 ? 'L' : 'R');      // 轻点左/右半屏也可
    };
    function finish(skipped) {
      finished = true;
      removeEventListener('keydown', onKey);
      cutEl.removeEventListener('pointerdown', onDown); cutEl.removeEventListener('pointerup', onUp);
      box.classList.remove('on'); box.innerHTML = ''; gPrompt.classList.remove('on'); Cut.cancel = null;
      if (skipped) for (const n of notes) if (!n.done) { n.done = true; onJudge(n, .7); }
      res({ score: skipped ? null : (perfect + good * .7) / notes.length, perfect, good, miss });
    }
    addEventListener('keydown', onKey);
    cutEl.addEventListener('pointerdown', onDown); cutEl.addEventListener('pointerup', onUp);
    Cut.cancel = () => finish(true);
    if (Cut.skip) finish(true); else tick(loop);
  });
}

// —— 构件拼装：把亭子的构件按自下而上的顺序拖到虚影上 ——
function assemble({ P, pg, order, info }) {
  return new Promise(res => {
    const tray = document.getElementById('tray'), tip = document.getElementById('asmTip');
    tray.innerHTML = ''; tray.classList.add('on'); tip.classList.add('on'); tip.classList.remove('bad');
    tip.textContent = '把右侧虚影补全：从下往上，一件一件装'; dlg.classList.remove('show');
    gText.textContent = '拖动左侧构件到亭子虚影上 · 空格键可自动放置下一件'; gPrompt.classList.add('on');
    let step = 0, errors = 0, wrongHere = 0, finished = false, drag = null;
    const cards = {};
    for (const key of order.slice().sort(() => rnd() - .5)) {
      const card = document.createElement('div'); card.className = 'part';
      const sv = document.createElementNS(NS, 'svg');
      const clone = P[key].cloneNode(true); clone.removeAttribute('opacity'); clone.removeAttribute('transform');
      sv.appendChild(clone);
      const bb = P[key].getBBox();
      sv.setAttribute('viewBox', `${f1(bb.x - 8)} ${f1(bb.y - 8)} ${f1(bb.width + 16)} ${f1(bb.height + 16)}`);
      const lb = document.createElement('span'); lb.textContent = info[key].label;
      card.append(sv, lb); tray.appendChild(card); cards[key] = card;
      card.addEventListener('pointerdown', e => {
        e.stopPropagation(); e.preventDefault();
        if (finished || card.classList.contains('used')) return;
        const gh = card.cloneNode(true); gh.classList.add('ghost');
        gh.style.left = e.clientX + 'px'; gh.style.top = e.clientY + 'px';
        document.body.appendChild(gh); drag = { key, gh };
      });
    }
    const reveal = (key) => {
      const part = P[key], isCols = key === 'cols', lift = key === 'roof' || key === 'top' ? 170 : 40;
      return tween(650, k => {
        const e = easeOut(k);
        if (isCols) part.setAttribute('transform', `translate(0,${P.pt}) scale(1,${Math.max(.001, e).toFixed(3)}) translate(0,${-P.pt})`);
        else part.setAttribute('transform', `translate(0,${f1(-(1 - e) * lift)})`);
        part.setAttribute('opacity', f1(Math.min(1, e * 1.5)));
      });
    };
    const place = key => {
      if (finished) return;
      if (key === order[step]) {
        cards[key].classList.add('used'); reveal(key);
        tip.classList.remove('bad'); tip.textContent = info[key].tip;
        step++; wrongHere = 0;
        if (step === order.length) setTimeout(() => finish(false), 900);
      } else {
        errors++; wrongHere++;
        const c = cards[key]; c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
        tip.classList.add('bad');
        tip.textContent = wrongHere >= 2 ? `提示：下一件应是「${info[order[step]].label}」` : '顺序不对——亭子是从下往上一件件建起来的';
      }
    };
    const onMove = e => { if (drag) { drag.gh.style.left = e.clientX + 'px'; drag.gh.style.top = e.clientY + 'px'; } };
    const onUp = e => {
      if (!drag) return;
      const r = pg.getBoundingClientRect(), { key, gh } = drag; drag = null; gh.remove();
      if (e.clientX > r.left - 40 && e.clientX < r.right + 40 && e.clientY > r.top - 60 && e.clientY < r.bottom + 40) place(key);
    };
    const onKey = e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); place(order[step]); } };
    function finish(skipped) {
      if (finished) return; finished = true;
      removeEventListener('pointermove', onMove); removeEventListener('pointerup', onUp); removeEventListener('keydown', onKey);
      if (skipped) for (const k of order) { P[k].setAttribute('opacity', 1); P[k].removeAttribute('transform'); }
      tray.classList.remove('on'); tray.innerHTML = ''; tip.classList.remove('on'); gPrompt.classList.remove('on'); Cut.cancel = null;
      res({ score: skipped ? null : clamp(1 - errors * .12, 0, 1), errors });
    }
    addEventListener('pointermove', onMove); addEventListener('pointerup', onUp); addEventListener('keydown', onKey);
    Cut.cancel = () => finish(true);
    if (Cut.skip) finish(true);
  });
}

let cgRunning = false;
function playCG() {
  return new Promise(res => {
    if (cgRunning) return res();
    cgRunning = true;
    cgStage.innerHTML = ''; cgTitle.classList.remove('on'); cgSub.textContent = '';
    cgEl.classList.add('on'); cgEl.style.opacity = 0;
    void cgEl.offsetWidth; cgEl.style.opacity = 1;
    let t0 = performance.now(), cur = -1, ctx = null, box = null, prev = null, ring = null, done = false;
    let hold = null;   // 调试：#cg 下可用 __cgSeek(秒, true) 定格到某一时刻
    if (location.hash === '#cg') window.__cgSeek = (sec, pause) => { t0 = performance.now() - sec * 1000; hold = pause ? sec : null; };
    const finish = () => {
      if (done) return; done = true;
      cgEl.style.opacity = 0;
      setTimeout(() => { cgEl.classList.remove('on'); cgStage.innerHTML = ''; cgTitle.classList.remove('on'); cgRunning = false; res(); }, 800);
    };
    document.getElementById('cgSkip').onclick = e => { e.stopPropagation(); finish(); };
    const loop = () => {
      if (done) return;
      const t = hold != null ? hold : (performance.now() - t0) / 1000;
      if (t >= CG_LEN) return finish();
      let i = SHOTS.length - 1;
      while (i > 0 && t < SHOTS[i].start) i--;
      const sh = SHOTS[i];
      if (i !== cur) {
        if (prev) prev.remove();
        prev = box; cur = i;
        box = document.createElement('div'); box.className = 'shot';
        cgStage.appendChild(box);
        ctx = sh.build(box);
        if (sh.enter === 'moon') { ring = moonRing(); box.appendChild(ring); }
        if (sh.enter === 'flash') { cgFlash.style.transition = 'none'; cgFlash.style.opacity = 1; void cgFlash.offsetWidth; cgFlash.style.transition = 'opacity .7s'; cgFlash.style.opacity = 0; }
        if (sh.enter === 'cut' || sh.enter === 'flash') { if (prev) { prev.remove(); prev = null; } }
      }
      const lt = t - sh.start, k = clamp(lt / sh.dur, 0, 1);
      // 进场转场
      if (sh.enter === 'fade') { box.style.opacity = f1(clamp(lt / .8, 0, 1)); if (lt > .8 && prev) { prev.remove(); prev = null; } }
      if (sh.enter === 'moon') {
        const m = easeIO(clamp(lt / 1.7, 0, 1)), Rr = m * Math.hypot(innerWidth, innerHeight) / 2 * 1.1;
        box.style.clipPath = lt < 1.7 ? `circle(${f1(Rr)}px at 50% 50%)` : 'none';
        if (ring) {
          ring.style.transform = `translate(-50%,-50%) scale(${(2.6 * Math.max(Rr, 1) / 1000).toFixed(4)}) rotate(${f1(lt * 40)}deg)`;
          ring.style.opacity = f1(1 - seg(lt, 1.3, 1.7));
          if (lt > 1.7) { ring.remove(); ring = null; if (prev) { prev.remove(); prev = null; } }
        }
      }
      sh.update(ctx, lt, k);
      const sub = CG_SUBS.find(([st, du]) => t >= st && t < st + du);
      const txt = sub ? sub[2] : '';
      if (cgSub.textContent !== txt) cgSub.textContent = txt;
      tick(loop);
    };
    tick(loop);
  });
}

let last = performance.now();

      want = clamp(((camX + pX / s) - boatX) * .05, -MAXV, MAXV);
      wantY = clamp((clamp(pY / s, LANE_MIN, LANE_MAX) - boatY) * .08, -2.6, 2.6);
    }

  } else if (state === 'moor') {

    wantY = clamp((WATER - boatY) * .05, -1.5, 1.5);

  if (state === 'play' && next < NODES.length && boatX >= NODES[next].trig) triggerNode(next++);
  if (boatX > MINX + 160) hint.classList.add('hide');

  const camT = clamp(boatX - VW * .36, 0, Math.max(0, W - VW));
  camX = Number.isFinite(camX) ? camX + (camT - camX) * .06 * dt : camT;

  for (const L of Object.values(LAYERS)) L.div.style.transform = `translate3d(${-camX * L.f * s}px,0,0)`;
  const bob = Math.sin(t * .0021) * 2.6;
  const shake = invuln > 60 ? Math.sin(t * .08) * 4 : 0;
  const tilt = clamp(boatV * .5, -2.5, 2.5) + Math.sin(t * .0016) * .8 + shake * .6;
  const depth = .9 + (boatY - LANE_MIN) / (LANE_MAX - LANE_MIN) * .2;

  // 钓字面板：第一段剧情之后、第二段之前出现

  if (inRain && !seen.rain) { seen.rain = true; banner('墨雨来了——雨中的落花会晕散，抓紧收集！', 3200); }

  // 收集物
  for (const it of items) {
    if (!it.alive) continue;
    if (it.rainy && rainLv > .2) {
      it.life -= .0022 * rainLv * dt;
      it.el.style.opacity = f1(Math.max(0, it.life));
      if (it.life <= 0) { it.alive = false; it.el.remove(); continue; }
    }
    if (it.type === 'petal') it.x += .04 * dt;
    const y = it.y + Math.sin(t * .002 + it.ph) * 3;
    it.el.setAttribute('transform', `translate(${f1(it.x)},${f1(y)})`);

  }
  // 渔船
  for (const j of junks) {
    j.x = j.x0 + Math.sin(t * .0005 + j.ph) * 70;
    j.el.setAttribute('transform', `translate(${f1(j.x)},${f1(j.y + Math.sin(t * .002 + j.ph) * 2)})`);
    if (state === 'play' && Math.abs(j.x - boatX) < 480 && !seen.junk) { seen.junk = true; banner('前方有渔船——上下拖动（或 ↑ ↓）换水道避让'); }
    if (state === 'play' && invuln <= 0 && Math.abs(j.x - boatX) < 160 && Math.abs(j.y - boatY) < 26) {

    ripple(boatX - Math.sign(boatV) * 105, boatY + 8);
  }
  // 跃鱼：点击跃出水面的鱼 +3
  if (state === 'play' && t > fishAt) {
    fishAt = t + 4500 + Math.random() * 4500;
    const x0 = boatX + 180 + Math.random() * 360, y0 = LANE_MIN + Math.random() * (LANE_MAX - LANE_MIN);
    const e = el('path', { d: 'M-15,0 Q-2,-8 12,-1 L19,-7 L16,0 L19,7 L12,1 Q-2,8 -15,0 Z', fill: ink(.85) }, FX);
    fishes.push({ x0, y0, t0: t, e, x: null, y: null });
    ripple(x0, y0 + 4, 0, 1.3, .5);
  }
  for (let i = fishes.length - 1; i >= 0; i--) {
    const f = fishes[i], k = (t - f.t0) / 1400;
    if (f.caught) { fishes.splice(i, 1); continue; }
    if (k >= 1) { f.e.remove(); fishes.splice(i, 1); ripple(f.x0 + 80, f.y0 + 4, 0, 1.4, .55); ripple(f.x0 + 80, f.y0 + 4, 8, 1.4, .4); continue; }
    f.x = f.x0 + k * 80; f.y = f.y0 - Math.sin(k * Math.PI) * 70;
    const ang = Math.atan2(-70 * Math.PI * Math.cos(k * Math.PI), 80) * 180 / Math.PI;
    f.e.setAttribute('transform', `translate(${f1(f.x)},${f1(f.y)}) rotate(${f1(ang)})`);
  }
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    if (r.d > 0) { r.d -= dt; continue; }
    if (!r.e) r.e = el('ellipse', { cx: f1(r.x), cy: f1(r.y), rx: 8, ry: 2.2, 'stroke-width': 1.2 }, rippleG);
    r.rx += r.grow * dt; r.ry += r.grow * .2 * dt; r.o -= .007 * dt;
    if (r.o <= 0) { r.e.remove(); ripples.splice(i, 1); continue; }
    r.e.setAttribute('rx', f1(r.rx)); r.e.setAttribute('ry', f1(r.ry)); r.e.setAttribute('stroke', ink(f1(r.o)));
  }
  tick(frame);
}
tick(frame);
})();
</script>
