<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>巧排任务 · 闭馆之后</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
:root{--navy:#1b2a4a;--teal:#2f8f83;--coral:#e2674a;--must:#e0a526;--cream:#f7e9cc;--paper:#fbf3e2;--ink:#1d1d1b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0b1224;color:#f4ead6;font-family:"Noto Serif SC",serif}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
canvas#gl.hot{cursor:pointer}
canvas#gl.drag{cursor:grabbing}
canvas#gl.focus{cursor:default}
canvas#gl.focus.hot{cursor:pointer}
canvas#gl.dial{cursor:ew-resize}
button{font-family:inherit}

/* 左上：任务清单 */
#hud{position:fixed;left:18px;top:14px;z-index:5;pointer-events:none;text-shadow:0 1px 6px #000;transition:opacity .4s}
#hud b{display:block;font-family:"Ma Shan Zheng",serif;font-weight:400;font-size:30px;letter-spacing:.15em}
#hud small{font-size:12px;letter-spacing:.2em;opacity:.7}
#hud ul{list-style:none;margin-top:8px;font-size:14px;letter-spacing:.08em;line-height:1.9}
#hud li i{display:inline-block;width:16px;height:16px;border:2px solid #f4ead6;border-radius:3px;margin-right:8px;vertical-align:-3px;font-style:normal;font-size:12px;line-height:12px;text-align:center}
#hud li.done{opacity:.6}
#hud li.done i{background:var(--teal);border-color:var(--teal)}
#hud li.done i::after{content:'✓';color:#fff}
#hud li.next{color:#ffd28a}
#hud .res{margin-top:6px;font-size:13px;opacity:.85}
#btns{position:fixed;right:16px;top:14px;z-index:6;display:flex;gap:8px}
#btns button{background:rgba(11,18,36,.6);color:#f4ead6;border:1px solid rgba(255,255,255,.22);padding:6px 12px;border-radius:3px;cursor:pointer;font-size:13px;letter-spacing:.1em}
#help{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:5;font-size:13px;letter-spacing:.12em;background:rgba(11,18,36,.62);
  border:1px solid rgba(255,255,255,.15);padding:8px 16px;border-radius:4px;pointer-events:none;transition:opacity .8s;white-space:nowrap}
#cross{position:fixed;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;z-index:5;pointer-events:none;opacity:0;transition:opacity .2s}
#cross::before,#cross::after{content:'';position:absolute;background:rgba(255,240,210,.85)}
#cross::before{left:8px;top:2px;width:2px;height:14px}#cross::after{top:8px;left:2px;height:2px;width:14px}
#cross.on{opacity:1}
#tipBox{position:fixed;z-index:7;pointer-events:none;font-size:14px;letter-spacing:.1em;background:rgba(224,165,38,.95);color:#2a1606;padding:5px 12px;border-radius:3px;
  transform:translate(16px,-50%);opacity:0;transition:opacity .15s;white-space:nowrap}
#tipBox.on{opacity:1}
#pad{position:fixed;left:18px;bottom:18px;z-index:5;display:none;grid-template-columns:repeat(3,48px);gap:6px}
#pad button{width:48px;height:48px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(11,18,36,.55);color:#fff;font-size:20px;touch-action:none}
@media (pointer:coarse){#pad{display:grid}}

/* 字幕 */
#sub{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:8;max-width:min(820px,92vw);padding:10px 20px 12px;background:rgba(11,18,36,.78);
  border-left:4px solid var(--must);font-size:17px;line-height:1.7;letter-spacing:.06em;opacity:0;transition:opacity .3s;pointer-events:none}
#sub.on{opacity:1;pointer-events:auto;cursor:pointer}
#sub em{font-style:normal;color:#ffd28a;margin-right:10px;font-size:14px;letter-spacing:.15em}

/* 提示条 */
#toast{position:fixed;left:50%;top:18%;transform:translate(-50%,-10px);z-index:9;background:var(--paper);color:var(--navy);padding:10px 22px;border-radius:4px;
  box-shadow:0 6px 20px rgba(0,0,0,.4);font-size:16px;letter-spacing:.1em;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast small{display:block;font-size:12px;color:#6a5a3a;margin-top:2px;letter-spacing:.05em}

/* 展台操作面板 */
#panel{position:fixed;right:18px;top:64px;z-index:8;width:min(340px,92vw);background:var(--paper);color:var(--navy);border-radius:6px;padding:16px 18px 14px;
  box-shadow:0 10px 30px rgba(0,0,0,.45);display:none;font-size:14px;line-height:1.7}
#panel.on{display:block}
#panel.left{left:18px;right:auto;width:min(300px,92vw);top:14px}
#panel h3{font-family:"Ma Shan Zheng",serif;font-weight:400;font-size:28px;letter-spacing:.12em;line-height:1.2}
#panel .how{color:#5a4a2e;margin:6px 0 10px;font-size:13px}
#panel .big{font-size:22px;font-weight:700;letter-spacing:.06em;margin:4px 0}
#panel .big b{color:var(--coral)}
#panel .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#panel button{border:none;border-radius:4px;padding:8px 14px;font-size:14px;letter-spacing:.1em;cursor:pointer;background:var(--navy);color:#fff}
#panel button.alt{background:#e6d6b2;color:var(--navy)}
#panel button.warm{background:var(--coral)}
#panel button:disabled{opacity:.35;cursor:default}
#panel .timer{height:6px;background:#e6d6b2;border-radius:3px;overflow:hidden;margin-top:8px}
#panel .timer i{display:block;height:100%;width:100%;background:var(--teal)}
#panel .tip{margin-top:8px;font-size:13px;color:var(--teal);min-height:1.2em}
#panel .tip.bad{color:var(--coral)}
#panel .foot{display:flex;justify-content:space-between;margin-top:12px;border-top:1px dashed #d9c79f;padding-top:10px}
#panel .foot button{background:transparent;color:#6a5a3a;padding:2px 0;font-size:13px}
#gantt{position:fixed;left:18px;top:14px;z-index:8;width:min(700px,calc(100vw - 400px));height:auto;display:none;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#gantt.on{display:block}
#bubble{position:fixed;z-index:7;background:var(--paper);color:var(--navy);padding:10px 14px;border-radius:10px;font-size:15px;line-height:1.6;max-width:260px;
  box-shadow:0 6px 18px rgba(0,0,0,.4);transform:translate(-50%,-100%);display:none;pointer-events:none}
#bubble::after{content:'';position:absolute;left:50%;bottom:-10px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--paper);border-bottom:0}
#bubble b{color:var(--coral)}
#bubble.on{display:block}

/* 结算 */
#result,#ending{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:rgba(11,18,36,.55)}
#result.on,#ending.on{display:grid}
#ending{background:transparent}
.card{background:var(--paper);color:var(--navy);border-radius:8px;padding:26px 30px 22px;width:min(440px,92vw);box-shadow:0 16px 40px rgba(0,0,0,.5);text-align:center}
.card h2{font-family:"Ma Shan Zheng",serif;font-weight:400;font-size:34px;letter-spacing:.12em}
.card .g{display:inline-grid;place-items:center;width:84px;height:84px;margin:14px 0 6px;border-radius:50%;background:var(--coral);color:#fff;font-family:"Ma Shan Zheng",serif;font-size:52px}
.card .g.none{background:#b9ab8c;font-size:28px;font-family:inherit}
.card ul{list-style:none;font-size:15px;line-height:1.9;margin:8px 0 14px}
.card button{border:none;border-radius:4px;padding:10px 22px;font-size:15px;letter-spacing:.15em;cursor:pointer;background:var(--navy);color:#fff;margin:4px}
.card button.alt{background:#e6d6b2;color:var(--navy)}
#ending .card{width:min(560px,94vw)}
#ending .grades{display:flex;justify-content:center;gap:22px;margin:16px 0 6px}
#ending .grades div{font-size:14px;letter-spacing:.1em}
#ending .grades b{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 6px;border-radius:50%;background:var(--coral);color:#fff;font-family:"Ma Shan Zheng",serif;font-weight:400;font-size:34px}
#ending .grades b.none{background:#b9ab8c;font-size:18px;font-family:inherit}
#ending .note{font-size:14px;color:#5a4a2e;line-height:1.8;margin:8px 0 14px}

/* 开场 */
#start{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#2a3966 0%,#0b1224 72%);transition:opacity 1.1s}
#start.hide{opacity:0;pointer-events:none}
#start .box{text-align:center;padding:20px}
#start .k{font-size:13px;letter-spacing:.5em;opacity:.65}
#start h1{font-family:"Ma Shan Zheng",serif;font-weight:400;font-size:clamp(52px,10vw,104px);letter-spacing:.25em;margin:6px 0 2px;text-shadow:0 0 30px rgba(224,165,38,.35)}
#start p{font-size:15px;letter-spacing:.3em;opacity:.8}
#start .bar{width:min(360px,70vw);height:3px;background:rgba(255,255,255,.12);margin:28px auto 0;overflow:hidden}
#start .bar i{display:block;height:100%;width:0;background:var(--must);transition:width .3s}
#start button{margin-top:26px;padding:12px 36px;background:var(--must);color:#2a1606;border:none;border-radius:3px;font-size:18px;letter-spacing:.3em;cursor:pointer;opacity:.35;pointer-events:none}
#start button.ready{opacity:1;pointer-events:auto}
#start small{display:block;margin-top:16px;font-size:12px;letter-spacing:.12em;opacity:.6;line-height:1.9}
#err{color:#ff9b8a;margin-top:14px;font-size:13px;max-width:80vw;line-height:1.7}
#fade{position:fixed;inset:0;z-index:19;background:#fbf3e2;opacity:0;pointer-events:none;transition:opacity 1.2s}
</style>

{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<canvas id="gl"></canvas>
<div id="hud">
  <b>巧排任务</b><small>现代篇 · 闭馆后的华罗庚数学展馆</small>
  <ul id="tasks">
    <li data-k="shop"><i></i>展区一 · 柜台速算</li>

<div id="cross"></div>
<div id="tipBox"></div>
<div id="sub"></div>
<div id="toast"></div>
<div id="bubble"></div>

<div id="fade"></div>

<section id="result"><div class="card"><h2 id="rTitle"></h2><div class="g" id="rGrade"></div><ul id="rLines"></ul><button id="rBtn">继续参观</button></div></section>
<section id="ending"><div class="card">
  <h2>巧排任务 · 完成</h2>
  <div class="grades" id="endGrades"></div>
  <div class="note" id="endNote"></div>
  <button id="nextBtn">终章 · 纸上常州 →</button><br>
  <button class="alt" id="backBtn">回到展馆</button><button class="alt" id="againBtn">从头再逛</button>
</div></section>

<section id="start">
  <div class="box">
    <div class="k">现代篇</div>
    <h1>巧排任务</h1>
    <p>雨夜 · 闭馆后的华罗庚数学展馆</p>
    <div class="bar"><i id="prog"></i></div>
    <button id="enter">进入展馆</button>
    <small id="loadTxt">正在载入展馆……</small>
    <small>拖动画面环顾 · W A S D 走动 · 指向展品点击互动<br>三处复原展区都完成后，尾厅的出口会亮起</small>
    <div id="err"></div>
  </div>
</section>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutlinePass } from 'three/addons/postprocessing/OutlinePass.js';
import { applyDetail, buildProps, buildAtmos, detailUniforms } from './museum-dress.js';

/* ================= 配置 ================= */
const MODEL_DIR = '../material/';                     // Codex 交付的模型目录（相对本页）
const FILES = ['S0_shell', 'S1_lobby', 'S2_shop', 'S3_tea', 'S4_factory', 'S5_exit', 'S6_common'];
const NEXT_URL = '../scene-04-finale.html';           // 出口门后的终章
const SAVE_KEY = 'cz-scroll-v1', CHAPTER_ID = 'hua', RES_NAME = '灵感';
// 平面图用 Blender 坐标（米，Z 向上）；three 里是 (x, z, -y)
const B = (x, y, z = 0) => new THREE.Vector3(x, z, -y);
const EYE = 1.6, RADIUS = .28, REACH = 3.0;
const LOOK = { drag: .0019, lock: .0012, damp: 10, pitchMin: -1.1, pitchMax: .8, walk: 1.7, run: 2.8 };
const SPAWN = { p: B(0, 1.1), yaw: 0 };
const NAVY = '#1b2a4a', TEAL = '#2f8f83', CORAL = '#e2674a', MUST = '#e0a526', CREAM = '#f7e9cc', PAPER = '#fbf3e2', INK = '#1d1d1b';
const BRUSH = '"Ma Shan Zheng", "ZCOOL XiaoWei", serif', SERIF = '"Noto Serif SC", serif', ROUND = '"ZCOOL XiaoWei", "Noto Serif SC", serif';

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const easeIO = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const R = (a, b) => a + Math.random() * (b - a);
const pickOne = a => a[Math.floor(Math.random() * a.length)];
// 下一帧：页面在后台时 requestAnimationFrame 会暂停，用定时器兜底
function tick(cb) { let done = false; const f = () => { if (done) return; done = true; cb(); }; requestAnimationFrame(f); setTimeout(f, 60); }
const gradeOf = sc => sc == null ? '—' : sc >= .85 ? '甲' : sc >= .6 ? '乙' : '丙';

/* ================= 存档与进度 ================= */
function loadSave() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || { chapters: {} }; } catch (e) { return { chapters: {} }; } }
function saveChapter(rec) {
  try { const s = loadSave(); s.chapters = s.chapters || {}; s.chapters[CHAPTER_ID] = Object.assign({ at: Date.now() }, rec); localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } catch (e) {}
}
const CARDS = [   // 图鉴（与平面版同名，终章按数量显示）
  { id: 'jintan', name: '金坛' }, { id: 'shop', name: '小店自学' }, { id: 'qinghua', name: '走进清华' },
  { id: 'tongchou', name: '统筹法' }, { id: 'youxuan', name: '优选法' }, { id: 'symbols', name: '数学符号' },
];
const game = { done: { shop: false, tea: false, opt: false }, grades: [null, null, null], idea: 0, cards: new Set(), syms: new Set(), finished: false };
function unlockCard(id) {
  if (game.cards.has(id)) return;
  game.cards.add(id); const c = CARDS.find(c => c.id === id);
  toast(`图鉴 +1 · ${c.name}`, `已收集 ${game.cards.size} / ${CARDS.length}`);
}
function addIdea(n) { game.idea += n; updHud(); }
function updHud() {
  const order = ['shop', 'tea', 'opt'], nxt = order.find(k => !game.done[k]);
  document.querySelectorAll('#tasks li').forEach(li => { li.classList.toggle('done', game.done[li.dataset.k]); li.classList.toggle('next', li.dataset.k === nxt); });
  $('res').textContent = `${RES_NAME} ✦ ${game.idea} · 符号卡 ${game.syms.size} / ${SYMS.length}`;
}

/* ================= 渲染器 / 场景 / 灯光 ================= */
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#0d1730');
scene.fog = new THREE.Fog('#0d1730', 18, 46);
const camera = new THREE.PerspectiveCamera(60, 1, .03, 90);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture;
// 夜里闭馆：底光压暗，靠展灯打出一块块暖色光池；天窗漏下两束冷色月光
const hemi = new THREE.HemisphereLight('#5d72b0', '#3a2416', .32); scene.add(hemi);
scene.add(new THREE.AmbientLight('#ffd7a8', .07));
const moons = [[0, 4, 1.8], [5, 12, 1.8]].map(([x, y, r]) => {
  const m = new THREE.SpotLight('#8aa8ff', 26, 14, Math.atan(r / 9), .6, 1.2);
  m.position.copy(new THREE.Vector3(x, 9.5, -y)); m.target.position.set(x, 0, -y); scene.add(m, m.target); return m;
});
const lights = {};   // 运行中需要调节的灯

/* ================= 画布贴图（SIGN_ 空白面） ================= */
const signs = {};   // name -> { cv, cx, tex, mesh }
function canvasTex(w, h) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.flipY = false; tex.anisotropy = 8;
  return { cv, cx: cv.getContext('2d'), tex };
}
function makeSign(mesh, w, h, glow = .22, mirror = false) {   // glow：自发光强度（乘 0.25，物理光照下很小的值就够亮）
  const s = canvasTex(w, h);
  if (mirror) { s.tex.wrapS = THREE.RepeatWrapping; s.tex.repeat.x = -1; }
  mesh.material = new THREE.MeshStandardMaterial({ map: s.tex, color: '#d4cec2', emissive: '#ffffff', emissiveMap: s.tex, emissiveIntensity: glow * .25, roughness: .88, metalness: 0, side: THREE.DoubleSide });
  s.mesh = mesh; signs[mesh.name] = s;
  return s;
}
function wrapText(cx, text, x, y, maxW, lh) {
  let line = '', yy = y;
  for (const ch of text) {
    if (ch === '\n') { cx.fillText(line, x, yy); line = ''; yy += lh; continue; }
    if (cx.measureText(line + ch).width > maxW && line) { cx.fillText(line, x, yy); line = ch; yy += lh; }
    else line += ch;
  }
  if (line) cx.fillText(line, x, yy);
  return yy + lh;
}
function paperFill(cx, w, h, col = PAPER) {
  cx.fillStyle = col; cx.fillRect(0, 0, w, h);
  for (let i = 0; i < 260; i++) { cx.fillStyle = `rgba(120,90,40,${R(.02, .06).toFixed(3)})`; cx.fillRect(R(0, w), R(0, h), R(1, 3), R(1, 3)); }
}
const TIMELINE = [
  ['1910', '生于江苏金坛', '金坛今属常州。小镇、小店，是他最早的“课堂”。'],
  ['少年', '小店里自学', '初中毕业后因家境困难辍学，回父亲的小店帮忙，一边站柜台，一边自学数学。'],
  ['1930', '一篇论文', '他发表的论文受到清华大学熊庆来的注意，随后被请到清华工作。'],
  ['1950', '回到祖国', '回国投身数学研究与人才培养。'],
  ['1960 年代起', '走进工厂与田间', '推广统筹法、优选法，把数学用到生产实践里。'],
  ['1985', '数学家的一生', '他一生都在把数学讲给更多人听。今天的金坛华罗庚纪念馆，是认识他的入口。'],
];
const LABELS = {

const loadOne = f => new Promise((res, rej) => loader.load(`${MODEL_DIR}${f}.glb`, g => { prog.style.width = (++loaded / FILES.length * 100).toFixed(0) + '%'; res([f, g.scene]); }, undefined, rej));
Promise.all(FILES.map(loadOne)).then(list => {
  for (const [f, root] of list) {
    if (f === 'S6_common') { common = root; continue; }
    museum.add(root);
  }
  common.traverse(o => { if (o.name) N[o.name] = N[o.name] || o; });
  museum.traverse(o => { if (o.name) N[o.name] = o; });

function ownMats(root) {

    o.userData.own = true; o.userData.e0 = m.emissive ? m.emissive.clone() : new THREE.Color(0); o.userData.ei0 = m.emissiveIntensity ?? 1;

function glow(root, k) {

let actx = null, rainGain = null, soundOn = true;
function audioInit() {
  if (actx) return;

  const len = actx.sampleRate * 2, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
  let last = 0; for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + .02 * w) / 1.02; d[i] = last * 3.5 + w * .035; }
  const src = actx.createBufferSource(); src.buffer = buf; src.loop = true;
  const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2000;
  rainGain = actx.createGain(); rainGain.gain.value = .22;
  src.connect(lp).connect(rainGain).connect(actx.destination); src.start();
}
function beep(f = 660, dur = .08, type = 'triangle', vol = .12, slide = 0) {

  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .02);
}

  coin: () => { beep(1568, .06, 'square', .05); setTimeout(() => beep(2093, .12, 'square', .05), 60); },

function noise(dur, freq, vol, attack = .005) {   // 滤波噪声：脚步（短、低）和雷声（长、更低）

  const len = Math.floor(actx.sampleRate * dur), buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1);
  const src = actx.createBufferSource(), lp = actx.createBiquadFilter(), g = actx.createGain(), t = actx.currentTime;

  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(.0001, t + dur);

}

const ray = new THREE.Raycaster();
function pick() {

  const hits = ray.intersectObject(museum, true);
  for (const h of hits) {
    const o = h.object;

    if (o.userData.glass) continue;                       // 展柜玻璃不挡手
    let it = owner.get(o);
    if (it && (it.mode === mode || it.mode === 'any' || (mode === 'focus' && it.mode === focus?.id))) return { it, obj: o, d: h.distance, point: h.point };

let camAnim = null, walkPose = null;

}
const quatLook = (eye, at) => { const m = new THREE.Matrix4().lookAt(eye, at, new THREE.Vector3(0, 1, 0)); return new THREE.Quaternion().setFromRotationMatrix(m); };

async function finishExhibit(k, idx, score, title, lines, card, words) {

  perf.n++; perf.sum += dt;

  const ms = perf.sum / perf.n * 1000; perf.n = 0; perf.sum = 0;
  if (ms < 26) { perf.step = 9; return; }
  if (perf.step === 0) { gtao.enabled = false; perf.step = 1; console.info('[画质] 关闭环境光遮蔽', ms.toFixed(1) + 'ms'); }
  else { renderer.shadowMap.enabled = false; scene.traverse(o => { if (o.material) [].concat(o.material).forEach(m => m.needsUpdate = true); }); perf.step = 2; console.info('[画质] 关闭阴影', ms.toFixed(1) + 'ms'); }

const clock = new THREE.Clock();

    const r = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0);
