<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>经纬织城 · 刘国钧 × 大成纺织</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ebe3cf; --paper-hi:#f5efe0; --ink:#16140f; --ink-2:#2f2b25; --ink-soft:rgba(22,20,15,.55);
  --seal:#b5321f; --gold:#e8b44a; --bar:#16140f;
  --brush:"ZCOOL QingKe HuangYou","STXingkai","KaiTi",sans-serif;
  --serif:"Noto Serif SC","Songti SC","SimSun",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--serif)}
button{font:inherit;color:inherit}

/* ---------- 场景层 ---------- */
#stage{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--paper)}
#stage.dragging{cursor:grabbing}
.layer{position:absolute;left:0;top:0;will-change:transform}
.layer svg{display:block;overflow:visible}
#player{position:absolute;left:0;top:0;will-change:transform;transform-origin:50% 100%}
#player svg{display:block;overflow:visible;filter:drop-shadow(0 0 1.5px #f5efe0) drop-shadow(0 0 1.5px #f5efe0) drop-shadow(0 0 1px #f5efe0)}
#grain{position:fixed;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.55;z-index:25}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(22,20,15,.22) 100%)}
.marker .dot{transform-box:fill-box;transform-origin:center;animation:bob 2.4s ease-in-out infinite}
.marker .ring{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.5);opacity:.9}100%{transform:scale(2.4);opacity:0}}
@keyframes bob{50%{transform:translateY(-6px)}}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:16px 22px;pointer-events:none;z-index:5;transition:opacity .6s}
.chapter{display:flex;gap:12px;align-items:center}
.seal-sm{width:36px;height:36px;display:grid;place-items:center;background:var(--seal);color:var(--paper-hi);font-family:var(--brush);font-size:22px}
.chapter b{display:block;font-family:var(--brush);font-weight:400;font-size:28px;letter-spacing:.12em;line-height:1}
.chapter small{display:block;margin-top:5px;font-size:12px;letter-spacing:.18em;color:var(--ink-soft)}
.hud-r{display:flex;gap:20px;align-items:flex-start}
#inkMeter{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;letter-spacing:.2em;color:var(--ink-soft)}
#inkMeter .v{display:flex;align-items:center;gap:6px;font-family:var(--brush);font-size:26px;color:var(--ink);line-height:1}
#inkMeter svg{width:16px;height:22px}
#inkMeter.bump .v{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.25)}}
#progress{list-style:none;display:flex;gap:18px;margin-top:4px}
#progress li{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;letter-spacing:.2em;color:var(--ink-soft)}
#progress i{width:18px;height:18px;border:2px solid var(--ink-soft);transform:rotate(45deg) scale(.8);transition:background .6s,border-color .6s}
#progress li.done i{background:var(--seal);border-color:var(--ink)}
#progress li.done{color:var(--ink)}
#bookBtn{pointer-events:auto;border:2px solid var(--ink);background:var(--paper-hi);padding:5px 10px;font-size:12px;letter-spacing:.18em;cursor:pointer;margin-top:2px}

#card{position:fixed;left:24px;top:92px;width:min(380px,calc(100vw - 32px));z-index:6;background:var(--paper-hi);border:3px solid var(--ink);
  box-shadow:6px 6px 0 var(--ink);padding:22px 24px 20px;opacity:0;transform:translateY(16px);transition:opacity .6s,transform .6s;pointer-events:none}
#card.show{opacity:1;transform:none}
#card .seal{position:absolute;right:16px;top:-16px;width:42px;height:42px;display:grid;place-items:center;background:var(--seal);color:var(--paper-hi);font-family:var(--brush);font-size:26px;border:2px solid var(--ink)}
#card h2{font-family:var(--brush);font-weight:400;font-size:32px;letter-spacing:.12em;margin-bottom:8px}
#card p{font-size:15px;line-height:1.9;color:var(--ink-2);text-align:justify}
#card small{display:block;margin-top:10px;font-size:12px;color:var(--ink-soft)}
#card small:empty{display:none}
#hint{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:6;text-align:center;font-size:15px;letter-spacing:.2em;color:var(--paper-hi);
  background:var(--ink);padding:8px 18px;pointer-events:none;transition:opacity .8s}
#hint small{display:block;margin-top:2px;font-size:12px;opacity:.75;letter-spacing:.12em}
#hint.hide{opacity:0}
#jumpBtn{position:fixed;right:22px;bottom:26px;z-index:6;width:64px;height:64px;border-radius:50%;border:3px solid var(--ink);background:var(--seal);
  color:var(--paper-hi);font-family:var(--brush);font-size:26px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);display:none;touch-action:none}
#jumpBtn.on{display:block}
#foot{position:fixed;right:96px;bottom:12px;font-size:11px;letter-spacing:.12em;color:var(--ink-soft);z-index:5;pointer-events:none}
.toast{position:fixed;z-index:8;pointer-events:none;font-family:var(--brush);font-size:22px;color:var(--ink);white-space:nowrap;
  text-shadow:0 0 4px var(--paper-hi),0 0 8px var(--paper-hi);transform:translate(-50%,-50%);animation:rise 1.3s ease-out forwards}
.toast.bad{color:var(--seal)}
@keyframes rise{to{transform:translate(-50%,-160%);opacity:0}}
#banner{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:8;background:var(--paper-hi);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
  padding:8px 20px;font-size:14px;letter-spacing:.12em;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
#banner.show{opacity:1}
.drop{position:fixed;width:20px;height:20px;margin:-10px 0 0 -10px;background:var(--seal);border:2px solid var(--ink);transform:rotate(45deg);z-index:7;pointer-events:none;
  transition:left .95s cubic-bezier(.6,.05,.3,1),top .95s cubic-bezier(.6,.05,.3,1),opacity .3s .9s}

#book{position:fixed;inset:0;z-index:35;background:rgba(22,20,15,.6);display:none;place-items:center}
#book.on{display:grid}
#book .panel{width:min(760px,calc(100vw - 32px));max-height:calc(100vh - 48px);overflow:auto;background:var(--paper-hi);border:3px solid var(--ink);padding:24px 26px;box-shadow:8px 8px 0 var(--ink)}
#book h3{font-family:var(--brush);font-weight:400;font-size:30px;letter-spacing:.15em;display:flex;justify-content:space-between;align-items:center}
#book h3 button{font-family:var(--serif);font-size:13px;letter-spacing:.15em;border:2px solid var(--ink);background:none;padding:4px 12px;cursor:pointer}
#book .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:16px}
#book .c{border:2px solid var(--ink);padding:14px 14px 12px;background:var(--paper);min-height:132px;position:relative}
#book .c i{position:absolute;right:10px;top:10px;width:28px;height:28px;display:grid;place-items:center;background:var(--seal);color:var(--paper-hi);font-style:normal;font-family:var(--brush);font-size:18px}
#book .c b{display:block;font-family:var(--brush);font-weight:400;font-size:22px;margin-bottom:6px;padding-right:34px}
#book .c p{font-size:13px;line-height:1.8;color:var(--ink-2)}
#book .c.lock{background:repeating-linear-gradient(0deg,rgba(22,20,15,.06) 0 2px,transparent 2px 7px)}
#book .c.lock i{background:var(--ink-soft)}
#book .c.lock p,#book .c.lock b{color:var(--ink-soft)}

/* ---------- 剧情演出 ---------- */
#cut{position:fixed;inset:0;z-index:20;display:none;background:var(--paper);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
#cut.on{display:block}
#cutSvg{position:absolute;inset:0;width:100%;height:100%;display:block}
#cut .bar{position:absolute;left:0;right:0;height:8vh;min-height:44px;background:var(--bar);display:flex;align-items:center;justify-content:space-between;padding:0 24px;color:rgba(245,239,224,.8);z-index:2}
#cut .bar.top{top:0}
#cut .bar.bot{bottom:0;justify-content:center}
#cutTitle{font-family:var(--brush);font-size:24px;letter-spacing:.25em}
#cutTitle em{font-style:normal;color:var(--seal);background:var(--paper-hi);padding:0 6px;margin-right:10px}
#skipBtn{background:transparent;border:1px solid rgba(245,239,224,.4);color:rgba(245,239,224,.85);padding:4px 14px;font-size:13px;letter-spacing:.2em;cursor:pointer}
#gPrompt{display:flex;gap:10px;align-items:center;font-size:14px;letter-spacing:.18em;color:#f5efe0;opacity:0;transition:opacity .3s}
#gPrompt.on{opacity:1}
.mouse{width:14px;height:21px;border:1.5px solid currentColor;border-radius:7px;position:relative;flex:none}
.mouse::after{content:'';position:absolute;left:50%;top:3px;width:2px;height:5px;margin-left:-1px;background:var(--gold)}
#gest{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
#gest .chev{animation:chev 1.3s ease-in-out infinite}
@keyframes chev{0%,100%{opacity:.25}50%{opacity:1}}
#gest .start{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
#dlg{position:absolute;left:50%;bottom:calc(max(8vh,44px) + 14px);transform:translateX(-50%);width:min(900px,calc(100vw - 32px));text-align:center;opacity:0;transition:opacity .3s;pointer-events:none;z-index:4}
#dlg.show{opacity:1}
#dlg .who{display:inline-block;font-family:var(--brush);font-size:26px;color:var(--paper-hi);background:var(--seal);padding:2px 14px;letter-spacing:.2em}
#dlg.narr .who{display:none}
#dlg .line{display:block;margin:6px auto 0;width:fit-content;max-width:100%;padding:10px 26px;font-size:19px;line-height:1.8;color:var(--ink);background:var(--paper-hi);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
#dlg.narr .line{color:var(--ink-2);font-size:17px}
#dlg .note{font-size:13px;color:var(--ink-soft);margin-top:6px;min-height:1em}
#dlg .more{font-size:12px;color:var(--ink-soft);opacity:0;height:14px}
#dlg.ready .more{opacity:1;animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
#choice{position:absolute;left:50%;bottom:calc(max(8vh,44px) + 130px);transform:translateX(-50%);display:none;gap:16px;z-index:5}
#choice.on{display:flex}
#choice button{min-width:200px;padding:14px 22px;background:var(--paper-hi);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);cursor:pointer;font-size:16px;letter-spacing:.12em}
#choice button:hover{background:var(--ink);color:var(--paper-hi)}
#result{position:absolute;inset:0;display:none;place-items:center;z-index:6;background:rgba(235,227,207,.55)}
#result.on{display:grid}
#result .panel{width:min(420px,calc(100vw - 32px));background:var(--paper-hi);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:28px 30px 24px;text-align:center}
#result .g{width:96px;height:96px;margin:0 auto 14px;display:grid;place-items:center;background:var(--seal);color:var(--paper-hi);font-family:var(--brush);font-size:58px;border:3px solid var(--ink);transform:rotate(-5deg);animation:stamp .5s cubic-bezier(.3,1.6,.5,1)}
#result .g.none{background:transparent;color:var(--ink-soft);border:2px dashed var(--ink-soft);font-size:30px}
@keyframes stamp{from{transform:scale(2.2) rotate(-14deg);opacity:0}}
#result h3{font-family:var(--brush);font-weight:400;font-size:26px;letter-spacing:.15em}
#result ul{list-style:none;margin:10px 0 18px;font-size:14px;line-height:2;color:var(--ink-2)}
#result button{padding:9px 26px;border:2px solid var(--ink);background:var(--ink);color:var(--paper-hi);cursor:pointer;letter-spacing:.2em}
#tip{position:absolute;left:50%;top:calc(max(8vh,44px) + 14px);transform:translateX(-50%);z-index:5;display:none;background:var(--paper-hi);border:2px solid var(--ink);
  padding:8px 18px;font-size:15px;letter-spacing:.06em;max-width:min(640px,80vw);text-align:center}
#tip.on{display:block}
#tip.bad{color:var(--seal)}
/* 织机 */
#loomUI{position:absolute;right:24px;top:50%;transform:translateY(-50%);z-index:5;display:none;background:var(--paper-hi);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:12px 16px 14px;text-align:center;width:min(300px,40vw)}
#loomUI .steps{flex-wrap:wrap}
@media (max-width:760px){#loomUI{right:auto;left:50%;top:auto;bottom:calc(max(8vh,44px) + 10px);transform:translateX(-50%);width:min(420px,92vw)}}
#loomUI.on{display:block}
#loomUI .steps{display:flex;justify-content:center;gap:8px;margin-bottom:6px}
#loomUI .steps span{padding:3px 12px;border:2px solid var(--ink);font-size:14px;letter-spacing:.2em;color:var(--ink-soft)}
#loomUI .steps span.cur{background:var(--ink);color:var(--paper-hi)}
#loomUI .key{font-family:var(--brush);font-size:30px;letter-spacing:.1em}
#loomUI .key.bad{color:var(--seal);animation:shake .35s}
#loomUI .tbar{height:6px;background:rgba(22,20,15,.15);margin-top:6px}
#loomUI .tbar i{display:block;height:100%;background:var(--seal);width:100%}
#loomUI .cnt{font-size:12px;letter-spacing:.2em;color:var(--ink-soft);margin-top:4px}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
/* 流水线 */
#lineUI{position:absolute;left:50%;bottom:calc(max(8vh,44px) + 14px);transform:translateX(-50%);z-index:5;display:none;gap:10px}
#lineUI.on{display:flex}
#lineUI button{width:110px;padding:10px 0;background:var(--paper-hi);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);font-family:var(--brush);font-size:24px;cursor:pointer}
#lineUI button small{display:block;font-family:var(--serif);font-size:11px;letter-spacing:.1em;color:var(--ink-soft)}
#lineUI button:active,#lineUI button.hit{background:var(--seal);color:var(--paper-hi);transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
#runBtn{position:absolute;left:50%;bottom:calc(max(8vh,44px) + 18px);transform:translateX(-50%);z-index:5;display:none;padding:12px 34px;background:var(--seal);color:var(--paper-hi);
  border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);font-family:var(--brush);font-size:26px;letter-spacing:.3em;cursor:pointer}
#runBtn.on{display:block}
#runBtn:disabled{opacity:.5;cursor:wait}

#ink{position:fixed;left:0;top:0;width:600px;height:600px;margin:-300px 0 0 -300px;pointer-events:none;z-index:30;transform:scale(0);will-change:transform,opacity}
#ink svg{display:block;width:600px;height:600px;overflow:visible}

/* ---------- 开场 / 结尾 ---------- */
#intro{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:var(--paper);clip-path:inset(0 0 0 0);transition:clip-path 1.4s cubic-bezier(.7,0,.2,1)}
#intro.open{clip-path:inset(50% 0 50% 0)}
#intro .inner{display:flex;gap:40px;align-items:center}
#intro .blk{background:var(--ink);color:var(--paper-hi);padding:30px 24px;box-shadow:10px 10px 0 var(--seal)}
#intro h1{writing-mode:vertical-rl;font-family:var(--brush);font-weight:400;font-size:clamp(60px,11vh,104px);letter-spacing:.15em;line-height:1}
#intro .meta{writing-mode:vertical-rl;font-size:15px;letter-spacing:.4em;color:var(--ink-soft);line-height:2.2}
#intro .meta em{font-style:normal;color:var(--seal)}
#startBtn{width:90px;height:90px;border:3px solid var(--ink);background:var(--seal);color:var(--paper-hi);font-family:var(--brush);font-size:30px;cursor:pointer;box-shadow:6px 6px 0 var(--ink)}
#startBtn:hover{transform:translate(2px,2px);box-shadow:4px 4px 0 var(--ink)}
#ending{position:fixed;left:24px;top:92px;z-index:9;pointer-events:none;opacity:0;transition:opacity 1s}
#ending.show{opacity:1;pointer-events:auto}
#ending .panel{width:min(400px,calc(100vw - 32px));background:var(--paper-hi);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:30px 30px 24px;text-align:center}
#ending .stamp{width:96px;height:96px;margin:0 auto 16px;display:grid;place-items:center;background:var(--seal);color:var(--paper-hi);font-family:var(--brush);font-size:40px;writing-mode:vertical-rl;border:3px solid var(--ink)}
#ending p{font-size:16px;line-height:2;color:var(--ink-2)}
#ending .grades{display:flex;justify-content:center;gap:14px;margin:14px 0 4px}
#ending .grades div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;letter-spacing:.15em;color:var(--ink-soft)}
#ending .grades b{width:40px;height:40px;display:grid;place-items:center;background:var(--seal);color:var(--paper-hi);font-family:var(--brush);font-weight:400;font-size:24px;border:2px solid var(--ink)}
#ending .grades b.none{background:transparent;color:var(--ink-soft);border:2px dashed var(--ink-soft)}
#ending .got{margin-top:10px;font-size:13px;color:var(--ink-soft);letter-spacing:.1em}
#ending .got b{color:var(--ink)}
#ending .btns{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
#ending button{padding:9px 16px;border:2px solid var(--ink);background:transparent;cursor:pointer;letter-spacing:.12em;font-size:14px}
#ending button.primary{background:var(--ink);color:var(--paper-hi)}

/* ---------- 尾声 CG ---------- */
#cg{position:fixed;inset:0;z-index:24;display:none;background:var(--paper);transition:opacity .8s}
#cg.on{display:block}
#cgStage{position:absolute;inset:0;overflow:hidden;background:var(--paper)}
#cg .shot{position:absolute;inset:0;overflow:hidden}
#cg .lyr{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transform-origin:50% 50%;will-change:transform}
#cg .iris{position:absolute;left:50%;top:50%;width:1000px;height:1000px;pointer-events:none;will-change:transform}
#cg .iris svg{width:100%;height:100%;display:block}
#cg .bar{position:absolute;left:0;right:0;height:9vh;min-height:46px;background:var(--bar);display:flex;align-items:center;justify-content:space-between;padding:0 24px;color:rgba(245,239,224,.75);z-index:3}
#cg .bar.top{top:0}
#cg .bar.bot{bottom:0;justify-content:center}
#cg .bar.top span{font-family:var(--brush);font-size:22px;letter-spacing:.3em}
#cgSkip{background:transparent;border:1px solid rgba(245,239,224,.4);color:rgba(245,239,224,.85);padding:4px 14px;font-size:13px;letter-spacing:.2em;cursor:pointer}
#cgSub{font-size:clamp(15px,2vw,20px);letter-spacing:.2em;color:#f5efe0}
#cgFlash{position:absolute;inset:0;background:#fffaf0;opacity:0;pointer-events:none;z-index:2}
#cgTitle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;text-align:center;opacity:0;transition:opacity 1.2s;pointer-events:none;white-space:nowrap;
  background:var(--paper-hi);border:3px solid #1d1d1b;box-shadow:8px 8px 0 #1d1d1b;padding:22px 40px}
#cgTitle.on{opacity:1}
#cgTitle b{display:block;font-family:var(--brush);font-weight:400;font-size:clamp(36px,6vw,72px);letter-spacing:.15em;color:#1d1d1b}
#cgTitle span{display:block;margin-top:8px;font-size:clamp(12px,1.6vw,16px);letter-spacing:.2em;color:#2f8f83}

@media (max-width:640px){
  #hud{padding:12px 14px}
  .chapter b{font-size:20px}
  .chapter small{display:none}
  #progress{gap:10px}
  #card,#ending{left:16px;top:auto;bottom:100px}
  #foot{display:none}
  #dlg .line{font-size:15px;padding:8px 14px}
  #lineUI button{width:76px;font-size:20px}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs id="gdefs">
    <filter id="fCarve" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="fOutline" x="-15%" y="-15%" width="130%" height="130%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="d"/>
      <feFlood flood-color="#f5efe0"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="fGhost" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="fJag" x="-25%" y="-25%" width="150%" height="150%">

<script>
(() => {
/* ================= 场景配置 ================= */
const CHAPTER_ID = 'liu';                      // 存档中的篇章编号
const NEXT_URL = 'scene-03-hua.html';          // “下一章”跳转地址，组合时可改
const RES_NAME = '纱线';
const W = 4300, H = 900, G = 742, NS = 'http://www.w3.org/2000/svg';
const PAPER = '#ebe3cf', PHI = '#f5efe0', K = '#16140f', RED = '#b5321f', GREY = '#5c574d', GREY2 = '#8a8273', WARM = '#f1d9a0';
const BRUSH = '"ZCOOL QingKe HuangYou","STXingkai","KaiTi",sans-serif';

/* ================= 公共工具（各场景相同） ================= */
let sd = 19301930;
const rnd = () => (sd = (sd * 16807) % 2147483647, (sd - 1) / 2147483646);
const R = (a, b) => a + (b - a) * rnd();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const seg = (p, a, b) => clamp((p - a) / (b - a), 0, 1);
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIO = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const f1 = n => (+n).toFixed(1);
const ink = a => `rgba(22,20,15,${a})`;
const $ = id => document.getElementById(id);
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) k === 'text' ? (e.textContent = attrs[k]) : e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function bez(p0, c1, c2, p3, n) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    pts.push([u * u * u * p0[0] + 3 * u * u * t * c1[0] + 3 * u * t * t * c2[0] + t * t * t * p3[0],
              u * u * u * p0[1] + 3 * u * u * t * c1[1] + 3 * u * t * t * c2[1] + t * t * t * p3[1]]);
  }
  return pts;
}
function taper(pts, w0, w1, wob = 0) {
  const n = pts.length, Lp = [], Rp = [], ph = R(0, 6);
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1];
    const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
    const w = (w0 + (w1 - w0) * i / (n - 1)) / 2 * (1 + wob * Math.sin(i * 1.9 + ph));
    Lp.push([pts[i][0] - dy * w, pts[i][1] + dx * w]); Rp.push([pts[i][0] + dy * w, pts[i][1] - dx * w]);
  }
  return 'M' + Lp.concat(Rp.reverse()).map(p => `${f1(p[0])},${f1(p[1])}`).join('L') + 'Z';
}
const ellD = (cx, cy, rx, ry) => `M${f1(cx - rx)},${f1(cy)}a${f1(rx)},${f1(ry)} 0 1,0 ${f1(2 * rx)},0a${f1(rx)},${f1(ry)} 0 1,0 ${f1(-2 * rx)},0`;
// rAF 在后台 / 隐藏的 iframe 中可能暂停，用 setTimeout 兜底
function tick(cb) {
  let fired = false;
  const id = requestAnimationFrame(t => { fired = true; cb(t); });
  setTimeout(() => { if (!fired) { cancelAnimationFrame(id); cb(performance.now()); } }, 120);
}
// 跨篇章存档：各篇写入同一个 localStorage 键，终章读取汇总
const SAVE_KEY = 'cz-scroll-v1';
function loadSave() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || { chapters: {} }; } catch (e) { return { chapters: {} }; } }
function saveChapter(id, rec) {
  try { const s = loadSave(); s.chapters[id] = Object.assign({ at: Date.now() }, rec); localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } catch (e) {}
}

/* ================= 木刻绘制工具 ================= */
// 木刻刀痕：一组带断口的平行线
function hatch(g, x0, y0, x1, y1, gap, col, w = 2, op = 1, breakLen = [40, 220]) {
  let d = '';
  for (let y = y0; y < y1; y += gap) for (let x = x0; x < x1;) { const l = R(breakLen[0], breakLen[1]); d += `M${f1(x)},${f1(y + R(-1, 1))}h${f1(Math.min(l, x1 - x))}`; x += l + R(8, 50); }
  return el('path', { d, stroke: col, 'stroke-width': w, opacity: op, fill: 'none' }, g);
}
function shophouse(g, x, w, h, col = K) {
  const top = G - h;
  el('path', { d: `M${x},${G} L${x},${top + 16} L${x + w * .1},${top} L${x + w * .9},${top} L${x + w},${top + 16} L${x + w},${G} Z`, fill: col }, g);
  el('rect', { x: x - 6, y: top + 12, width: w + 12, height: 8, fill: col }, g);
  const rows = Math.max(1, Math.floor((h - 90) / 60));
  for (let r = 0; r < rows; r++) for (let i = 0; i < 3; i++) {
    const wx = x + w * (.14 + i * .28), wy = top + 34 + r * 60;
    el('path', { d: `M${f1(wx)},${f1(wy + 34)} L${f1(wx)},${f1(wy + 10)} Q${f1(wx + w * .09)},${f1(wy - 4)} ${f1(wx + w * .18)},${f1(wy + 10)} L${f1(wx + w * .18)},${f1(wy + 34)} Z`, fill: PHI, opacity: .9 }, g);
    el('line', { x1: f1(wx + w * .09), y1: f1(wy + 4), x2: f1(wx + w * .09), y2: f1(wy + 34), stroke: col, 'stroke-width': 2 }, g);
  }
  el('rect', { x: x + w * .36, y: G - 64, width: w * .28, height: 64, fill: PHI, opacity: .85 }, g);
  for (let k = 1; k < 4; k++) el('line', { x1: x + w * .36 + w * .07 * k, y1: G - 64, x2: x + w * .36 + w * .07 * k, y2: G, stroke: col, 'stroke-width': 2 }, g);
  hatch(g, x + 4, top + 22, x + w - 4, top + 30, 6, PHI, 1.2, .5, [10, 40]);
}
function factory(g, x, w, h, teeth, col = K, lit = 0) {
  const top = G - h, tw = w / teeth;
  let d = `M${x},${G} L${x},${top + 50}`;
  for (let i = 0; i < teeth; i++) d += ` L${f1(x + i * tw + tw * .72)},${top} L${f1(x + (i + 1) * tw)},${top} L${f1(x + (i + 1) * tw)},${top + 50}`;
  d += ` L${x + w},${G} Z`;
  el('path', { d, fill: col }, g);
  for (let i = 0; i < teeth; i++) el('path', { d: `M${f1(x + i * tw + tw * .76)},${top + 8} L${f1(x + (i + 1) * tw - 4)},${top + 8} L${f1(x + (i + 1) * tw - 4)},${top + 44} L${f1(x + i * tw + tw * .76)},${top + 44} Z`, fill: PHI, opacity: .85 }, g);
  const wins = [];
  for (let r = 0; r < 2; r++) for (let xx = x + 18; xx < x + w - 30; xx += 44) {
    wins.push(el('rect', { x: f1(xx), y: top + 78 + r * 50, width: 26, height: 30, fill: lit && rnd() < lit ? WARM : PHI, opacity: .9 }, g));
  }
  return wins;
}
function chimney(g, x, h, w = 34, col = K) {
  el('path', { d: `M${x - w / 2},${G} L${x - w / 2 + 4},${G - h} L${x + w / 2 - 4},${G - h} L${x + w / 2},${G} Z`, fill: col }, g);
  for (let y = G - h + 30; y < G - 40; y += 70) el('rect', { x: x - w / 2 + 2, y, width: w - 4, height: 6, fill: PHI, opacity: .6 }, g);
  let s = '';
  for (let i = 0; i < 6; i++) s += ellD(x - 20 - i * 38, G - h - 30 - i * 20, 26 + i * 9, 13 + i * 3);
  el('path', { d: s, fill: col, opacity: .55 }, g);
}
function pole(g, x, y0 = 400) {
  el('rect', { x: x - 4, y: y0, width: 8, height: G - y0, fill: K }, g);
  el('rect', { x: x - 30, y: y0 + 16, width: 60, height: 6, fill: K }, g);
  el('rect', { x: x - 22, y: y0 + 40, width: 44, height: 5, fill: K }, g);
}
function spool(g, red) {
  el('ellipse', { cx: 0, cy: 3, rx: 22, ry: 5, fill: ink(.12) }, g);
  el('rect', { x: -11, y: -24, width: 22, height: 44, fill: red ? RED : PHI, stroke: K, 'stroke-width': 2.4 }, g);
  let d = '';
  for (let y = -18; y <= 14; y += 5) d += `M-11,${y}L11,${y + 2}`;
  el('path', { d, stroke: K, 'stroke-width': 1.3, opacity: .7 }, g);
  el('ellipse', { cx: 0, cy: -24, rx: 15, ry: 5, fill: K }, g);
  el('ellipse', { cx: 0, cy: 20, rx: 15, ry: 5, fill: K }, g);
  el('path', { d: 'M11,-6 q14,6 6,18 t10,14', stroke: red ? RED : K, 'stroke-width': 1.6, fill: 'none' }, g);
}

/* ================= 人物：刘国钧（木刻，面向右） ================= */
// parts：{ bl 后腿, ba 后臂, body 躯干与头, fl 前腿, fa 前臂 }，静态符号可全部传同一组
function drawLiu(p) {
  const leg = (g, front) => {
    el('path', { d: 'M73,236 L69,292 L87,292 L89,236 Z', fill: K }, g);
    el('path', { d: 'M64,289 L92,289 Q102,291 102,299 L64,299 Z', fill: K }, g);
    if (front) el('path', { d: 'M83,246 L80,286', stroke: PHI, 'stroke-width': 1.5 }, g);
  };
  const arm = (g, front) => {
    el('path', { d: 'M71,104 Q65,150 69,196 L85,196 Q87,150 91,106 Z', fill: K }, g);
    el('circle', { cx: 77, cy: 203, r: 7, fill: PAPER, stroke: K, 'stroke-width': 2 }, g);
    if (front) el('path', { d: 'M81,122 Q79,160 81,190', stroke: PHI, 'stroke-width': 1.4, fill: 'none' }, g);
  };
  leg(p.bl, false); arm(p.ba, false);
  const b = p.body;
  el('path', { d: 'M58,100 Q81,90 104,100 L116,252 Q81,262 46,252 Z', fill: K }, b);
  for (const d of ['M70,132 Q65,192 60,246', 'M93,132 Q98,192 103,246', 'M81,150 L81,250'])
    el('path', { d, stroke: PHI, 'stroke-width': 1.6, fill: 'none', opacity: .8 }, b);
  el('path', { d: 'M80,101 Q95,112 106,120', stroke: PHI, 'stroke-width': 2, fill: 'none' }, b);
  for (const [cx, cy] of [[90, 108], [98, 113], [104, 118]]) el('circle', { cx, cy, r: 2, fill: PHI }, b);
  el('rect', { x: 74, y: 82, width: 14, height: 18, fill: PAPER, stroke: K, 'stroke-width': 2 }, b);
  el('path', { d: 'M66,56 Q64,38 80,34 Q96,34 99,50 L103,60 Q103,64 99,65 L98,72 Q95,84 82,85 Q68,83 66,70 Z', fill: PAPER, stroke: K, 'stroke-width': 3 }, b);
  el('path', { d: 'M66,56 Q63,44 70,38 L72,60 Q70,66 66,66 Z', fill: K }, b);
  el('path', { d: 'M73,58 Q68,60 70,68 Q75,69 75,63', fill: PAPER, stroke: K, 'stroke-width': 2 }, b);
  el('ellipse', { cx: 91, cy: 54, rx: 2.2, ry: 2.6, fill: K }, b);
  el('path', { d: 'M86,48 Q91,46 96,48 M92,73 L97,72 M100,60 L97,63', stroke: K, 'stroke-width': 2.2, fill: 'none' }, b);
  el('path', { d: 'M64,40 Q64,18 81,16 Q98,18 98,40 Z', fill: K }, b);
  el('rect', { x: 64, y: 33, width: 34, height: 6, fill: RED }, b);
  el('ellipse', { cx: 81, cy: 41, rx: 27, ry: 5, fill: K }, b);
  el('path', { d: 'M70,24 Q76,20 84,20', stroke: PHI, 'stroke-width': 1.5, fill: 'none' }, b);
  leg(p.fl, true); arm(p.fa, true);
}
const gdefs = $('gdefs');
{
  const sym = el('symbol', { id: 'sym-liu', viewBox: '0 0 160 320', overflow: 'visible' }, gdefs);
  drawLiu({ bl: sym, ba: sym, body: sym, fl: sym, fa: sym });
}
// 黄包车（朝左行驶）
function rickshaw(g) {
  const wheel = el('g', {}, g);
  el('circle', { cx: 0, cy: 0, r: 46, fill: 'none', stroke: K, 'stroke-width': 7 }, wheel);
  let sp = '';
  for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2; sp += `M0,0L${f1(Math.cos(a) * 44)},${f1(Math.sin(a) * 44)}`; }
  el('path', { d: sp, stroke: K, 'stroke-width': 2.4 }, wheel);
  el('circle', { r: 7, fill: K }, wheel);
  wheel.setAttribute('transform', 'translate(30,-48)');
  el('path', { d: 'M-12,-62 L62,-62 L74,-122 L44,-152 L22,-152 Z', fill: K }, g);
  el('path', { d: 'M28,-150 Q60,-205 98,-150 L84,-150 Q62,-182 42,-150 Z', fill: K }, g);
  el('path', { d: 'M-8,-66 L60,-66', stroke: RED, 'stroke-width': 4 }, g);
  el('path', { d: 'M-12,-64 L-112,-82', stroke: K, 'stroke-width': 5 }, g);
  const legs = el('g', {}, g);
  el('path', { d: 'M-104,-84 L-122,-2', stroke: K, 'stroke-width': 8, 'stroke-linecap': 'round' }, legs);
  el('path', { d: 'M-100,-84 L-86,-2', stroke: K, 'stroke-width': 8, 'stroke-linecap': 'round' }, legs);
  el('path', { d: 'M-122,-88 Q-104,-130 -86,-136 L-78,-122 Q-96,-112 -104,-80 Z', fill: K }, g);
  el('circle', { cx: -80, cy: -144, r: 10, fill: K }, g);
  el('path', { d: 'M-96,-148 L-80,-162 L-62,-148 Z', fill: K }, g);
  return { wheel, legs };
}

/* ================= 世界图层 ================= */
const LAYERS = { far: { f: .2 }, mid: { f: .5 }, main: { f: 1 }, fx: { f: 1 }, front: { f: 1.3 } };
for (const [k, L] of Object.entries(LAYERS)) {
  L.w = L.f >= 1 ? Math.round(W * L.f) : Math.round(W * L.f + 2400);
  L.div = $('L-' + k);
  L.svg = el('svg', { viewBox: `0 0 ${L.w} ${H}` }, L.div);
}
{ // 远景：刀痕天空、红日、远处烟囱
  const g = LAYERS.far.svg, w = LAYERS.far.w;
  hatch(g, 0, 40, w, 560, 15, K, 2, .3);
  el('circle', { cx: 960, cy: 230, r: 74, fill: RED }, g);
  for (let x = 120; x < w; x += R(260, 520)) chimney(g, x, R(160, 300), R(18, 28), GREY2);
  for (let x = 0; x < w; x += R(80, 160)) el('rect', { x, y: G - R(120, 220), width: R(60, 150), height: 300, fill: GREY2 }, g);
}
{ // 中景：灰色街屋与电线杆
  const g = LAYERS.mid.svg, w = LAYERS.mid.w;
  for (let x = 0; x < w; x += R(150, 230)) { const ww = R(120, 190); shophouse(g, x, ww, R(170, 260), GREY); }
  let wires = '', last = null;
  for (let x = 140; x < w; x += 420) {
    pole(g, x, 360);
    if (last != null) for (const yy of [378, 402]) wires += `M${last},${yy} Q${(last + x) / 2},${yy + 40} ${x},${yy}`;
    last = x;
  }
  el('path', { d: wires, stroke: K, 'stroke-width': 1.6, fill: 'none' }, g);
}
const M = LAYERS.main.svg;
const mdefs = el('defs', {}, M);
const NODE_X = [1300, 2460, 3700];
{ // 主景：街面与沿街房屋
  for (let x = 0; x < W; x += R(170, 240)) {
    if (NODE_X.some(c => Math.abs(x + 90 - c) < 340)) continue;
    shophouse(M, x, R(140, 200), R(150, 230), K);
  }
  for (let x = 160; x < W; x += 520) {
    if (NODE_X.some(c => Math.abs(x - c) < 300)) continue;

      steps.forEach((sp, i) => sp.classList.toggle('cur', i === st));
      $('lKey').textContent = LABEL[exp()]; $('lKey').classList.remove('bad');
      $('lCnt').textContent = `第 ${r + 1} / ${rows} 行`;
      gText.textContent = '按提示的方向键，或在画面上滑动；打纬可轻点画面';
      gPrompt.classList.add('on');
    };
    const doStep = k => {
      busy = true;
      if (k === 'U' || k === 'D') {
        const up = k === 'U';
        wOdd.setAttribute('stroke-width', up ? 4.6 : 1.6); wEven.setAttribute('stroke-width', up ? 1.6 : 4.6);
        wOdd.setAttribute('stroke', up ? PHI : GREY2); wEven.setAttribute('stroke', up ? GREY2 : PHI);
        h1.setAttribute('y', up ? 222 : 246); h2.setAttribute('y', up ? 280 : 256);
        setTimeout(() => busy = false, 120);
      } else if (k === 'R' || k === 'L') {
        const a = k === 'R' ? X0 - 60 : X1 + 60, b = k === 'R' ? X1 + 60 : X0 - 60, y = fell() - 70;
        const col = PATTERN.includes(r) ? RED : PHI;
        weft.setAttribute('stroke', col); weft.setAttribute('x1', a); weft.setAttribute('y1', y); weft.setAttribute('y2', y);
        tween(320, q => { const x = a + (b - a) * easeOut(q); shuttle.setAttribute('transform', `translate(${f1(x)},${y})`); weft.setAttribute('x2', f1(clamp(x, X0, X1))); })
          .then(() => busy = false);
      } else {
        const y0 = reedY(), y1 = fell() - 22;
        tween(260, q => reed.setAttribute('transform', `translate(0,${f1(y0 + (y1 - y0) * Math.sin(q * Math.PI))})`)).then(() => {
          const y = fell() - RH, red = PATTERN.includes(r);
          const row = el('g', {}, cloth);
          el('rect', { x: X0, y, width: X1 - X0, height: RH, fill: red ? RED : PHI, opacity: .5 + .5 * inkF }, row);
          let wv = ''; for (let x = X0 + (r % 2) * 10; x < X1; x += 20) wv += `M${x},${y + 3}h10`;
          el('path', { d: wv, stroke: K, 'stroke-width': 2, opacity: .55 }, row);
          if (flaw) el('path', { d: `M${X0 + 40 + R(0, 480)},${y}l14,${RH}m0,-${RH}l-14,${RH}`, stroke: RED === (red ? RED : '') ? K : RED, 'stroke-width': 4 }, row);
          weft.setAttribute('x2', weft.getAttribute('x1'));
          r++; flaw = false;
          reed.setAttribute('transform', `translate(0,${reedY()})`);
          shuttle.setAttribute('transform', `translate(${r % 2 ? X1 + 60 : X0 - 60},${fell() - 70})`);
          busy = false;
          if (r >= rows) finish(false);
        });
      }
    };
    const act = k => {
      if (finished || busy) return;
      const e = exp();
      if (k === e) ok++; else { bad++; flaw = true; $('lKey').classList.add('bad'); }
      doStep(e); st = (st + 1) % 3; t0 = performance.now();
      if (!finished) setTimeout(() => !finished && show(), 140);
    };
    const off = dirInput(act);
    const loop = () => {
      if (finished) return;
      const left = 1 - (performance.now() - t0) / limit();
      $('lBar').style.width = f1(clamp(left, 0, 1) * 100) + '%';
      if (left <= 0 && !busy) act('timeout');
      tick(loop);
    };
    function finish(skipped) {
      if (finished) return; finished = true; off();
      ui.classList.remove('on'); gPrompt.classList.remove('on'); Cut.cancel = null;
      res({ score: skipped ? null : ok / (rows * 3), bad });
    }
    show(); tick(loop);
    Cut.cancel = () => finish(true); if (Cut.skip) finish(true);
  });
}

// —— 天轴皮带：按牌子上的要求设置每台机器的主动轮大小与皮带直/交叉，再“开车”检验 ——
function beltGame(g) {
  return new Promise(res => {
    const SY = 196, MY = 600, NAMES = ['梳棉机', '并条机', '细纱机', '织布机', '染色机'];
    const NEEDS = [[1, 1], [-1, 0], [-1, 1], [1, 0], [-1, 0]];     // [方向 1=顺时针, 快=1]
    hatch(g, 0, 80, 1600, 150, 10, K, 2, .35);
    el('rect', { x: 140, y: SY - 10, width: 1380, height: 20, fill: K }, g);
    for (let x = 300; x < 1500; x += 240) el('rect', { x: x - 6, y: 80, width: 12, height: SY - 80, fill: K }, g);
    const fly = el('g', { transform: `translate(160,${SY + 250})` }, g);
    el('circle', { r: 130, fill: 'none', stroke: K, 'stroke-width': 16 }, fly);
    let sp = ''; for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; sp += `M0,0L${f1(Math.cos(a) * 124)},${f1(Math.sin(a) * 124)}`; }
    el('path', { d: sp, stroke: K, 'stroke-width': 8 }, fly);
    el('circle', { r: 20, fill: RED, stroke: K, 'stroke-width': 4 }, fly);
    el('path', { d: `M160,${SY + 120} L160,${SY}`, stroke: K, 'stroke-width': 12 }, g);
    el('text', { x: 160, y: SY + 420, 'text-anchor': 'middle', 'font-family': BRUSH, 'font-size': 30, fill: K, text: '动力机 ↻' }, g);
    const xs = [420, 650, 880, 1110, 1340];
    const ms = xs.map((x, i) => ({ x, name: NAMES[i], need: NEEDS[i], big: false, cross: false }));
    const spoke = (gg, r) => { let d = ''; for (let k = 0; k < 6; k++) { const a = k / 6 * Math.PI * 2; d += `M0,0L${f1(Math.cos(a) * r)},${f1(Math.sin(a) * r)}`; } return el('path', { d, stroke: K, 'stroke-width': 3 }, gg); };
    for (const m of ms) {
      m.belt = el('g', { cursor: 'pointer' }, g);
      m.drv = el('g', { transform: `translate(${m.x},${SY})`, cursor: 'pointer' }, g);
      m.drvC = el('circle', { r: 24, fill: PHI, stroke: K, 'stroke-width': 4 }, m.drv); m.drvS = spoke(m.drv, 22);
      m.pul = el('g', { transform: `translate(${m.x},${MY})` }, g);
      el('circle', { r: 34, fill: PHI, stroke: K, 'stroke-width': 4 }, m.pul); spoke(m.pul, 32);
      el('rect', { x: m.x - 76, y: MY + 44, width: 152, height: 110, fill: K }, g);
      hatch(g, m.x - 70, MY + 54, m.x + 70, MY + 110, 8, PHI, 1.2, .5, [20, 60]);
      el('text', { x: m.x, y: MY + 140, 'text-anchor': 'middle', 'font-family': BRUSH, 'font-size': 26, fill: PHI, text: m.name }, g);
      const tag = el('g', { transform: `translate(${m.x},${MY - 92})` }, g);
      el('rect', { x: -52, y: -24, width: 104, height: 40, fill: PHI, stroke: RED, 'stroke-width': 3 }, tag);
      el('text', { y: 6, 'text-anchor': 'middle', 'font-family': BRUSH, 'font-size': 26, fill: RED, text: `${m.need[0] > 0 ? '↻' : '↺'} ${m.need[1] ? '快' : '慢'}` }, tag);
      m.mark = el('text', { x: m.x + 58, y: MY - 30, 'font-family': BRUSH, 'font-size': 44, fill: RED, text: '' }, g);
      m.drv.addEventListener('pointerdown', e => { e.stopPropagation(); if (!running) { m.big = !m.big; draw(m); } });
      m.belt.addEventListener('pointerdown', e => { e.stopPropagation(); if (!running) { m.cross = !m.cross; draw(m); } });
    }
    function draw(m) {
      const rd = m.big ? 46 : 24, rm = 34;
      m.drvC.setAttribute('r', rd); m.drvS.setAttribute('transform', `scale(${rd / 22})`);
      m.belt.innerHTML = '';
      const a = m.cross ? [[m.x - rd, SY, m.x + rm, MY], [m.x + rd, SY, m.x - rm, MY]] : [[m.x - rd, SY, m.x - rm, MY], [m.x + rd, SY, m.x + rm, MY]];
      el('path', { d: `M${a[0][0]},${a[0][1]}L${a[0][2]},${a[0][3]}M${a[1][0]},${a[1][1]}L${a[1][2]},${a[1][3]}`, stroke: 'transparent', 'stroke-width': 40 }, m.belt);
      el('path', { d: `M${a[0][0]},${a[0][1]}L${a[0][2]},${a[0][3]}M${a[1][0]},${a[1][1]}L${a[1][2]},${a[1][3]}`, stroke: '#7a3b22', 'stroke-width': 7 }, m.belt);
      m.mark.textContent = '';
    }
    ms.forEach(draw);
    tip('点击天轴上的轮子切换大小，点击皮带切换直 / 交叉，然后按「开车」');
    gText.textContent = '直皮带同向、交叉皮带反向；主动轮大则快、小则慢 · 空格可提示一台';
    gPrompt.classList.add('on'); dlg.classList.remove('show');
    const btn = $('runBtn'); btn.classList.add('on'); btn.disabled = false;
    let running = false, runs = 0, wrongRuns = 0, hints = 0, finished = false;
    const isOk = m => (m.cross ? -1 : 1) === m.need[0] && (m.big ? 1 : 0) === m.need[1];
    const run = async () => {
      if (running || finished) return;
      running = true; btn.disabled = true; runs++;
      await tween(2200, k => {
        const a = k * 720;
        fly.setAttribute('transform', `translate(160,${SY + 250}) rotate(${f1(a)})`);
        for (const m of ms) {
          m.drvS.setAttribute('transform', `rotate(${f1(a)}) scale(${(m.big ? 46 : 24) / 22})`);
          const dir = m.cross ? -1 : 1, spd = (m.big ? 46 : 24) / 34;
          const wob = isOk(m) ? 0 : Math.sin(k * 60) * 4;
          m.pul.setAttribute('transform', `translate(${m.x + wob},${MY}) rotate(${f1(a * dir * spd)})`);
        }
      });
      const bad = ms.filter(m => !isOk(m));
      for (const m of ms) { m.mark.textContent = isOk(m) ? '✓' : '✗'; m.mark.setAttribute('fill', isOk(m) ? K : RED); }
      running = false; btn.disabled = false;
      if (!bad.length) { tip('全部机器转对了——开车成功！'); setTimeout(() => finish(false), 900); }
      else {
        wrongRuns++;
        tip(wrongRuns === 1 ? '有机器转反了或转速不对：交叉皮带会让机器反转；主动轮越大，机器转得越快。' : `还有 ${bad.length} 台不对，再检查一下`, true);
      }
    };
    const onClick = e => { e.stopPropagation(); run(); };
    btn.addEventListener('pointerdown', stop); btn.addEventListener('click', onClick);
    const onKey = e => {
      if (e.key === 'Enter') { e.preventDefault(); run(); }
      if (e.key === ' ' && !running) {
        e.preventDefault();
        const m = ms.find(m => !isOk(m));
        if (m) { hints++; m.big = !!m.need[1]; m.cross = m.need[0] < 0; draw(m); tip(`提示：${m.name}需要${m.need[0] > 0 ? '顺转' : '反转'}、${m.need[1] ? '快' : '慢'}——${m.cross ? '交叉' : '直'}皮带配${m.big ? '大' : '小'}轮`); }
      }
    };
    addEventListener('keydown', onKey);
    function finish(skipped) {
      if (finished) return; finished = true;
      removeEventListener('keydown', onKey); btn.removeEventListener('click', onClick);
      btn.classList.remove('on'); tip(''); gPrompt.classList.remove('on'); Cut.cancel = null;
      res({ score: skipped ? null : clamp(1 - wrongRuns * .18 - hints * .1, 0, 1), runs, wrongRuns, hints });
    }
    Cut.cancel = () => finish(true); if (Cut.skip) finish(true);
  });
}

// —— 纺织染流水线：在工位前选对工序，成品直接放行 ——
function lineGame(g, n) {
  return new Promise(res => {
    const BY = 560, GATE = 1000;
    hatch(g, 0, 70, 1600, 260, 12, K, 2, .3);
    for (let i = 0; i < 6; i++) el('path', { d: `M${i * 280},260 L${i * 280 + 200},140 L${i * 280 + 280},140 L${i * 280 + 280},260 Z`, fill: K }, g);
    for (let x = 100; x < 1600; x += 300) el('rect', { x: x - 10, y: 260, width: 20, height: 300, fill: GREY }, g);
    el('rect', { x: 60, y: BY, width: 1480, height: 44, fill: K }, g);
    const dash = el('path', { d: Array.from({ length: 60 }, (_, i) => `M${70 + i * 26},${BY + 22}h12`).join(''), stroke: PHI, 'stroke-width': 3 }, g);
    for (let x = 80; x < 1540; x += 70) el('circle', { cx: x, cy: BY + 62, r: 16, fill: K, stroke: PHI, 'stroke-width': 2 }, g);
    el('rect', { x: GATE - 100, y: BY - 230, width: 18, height: 236, fill: K }, g);
    el('rect', { x: GATE + 82, y: BY - 230, width: 18, height: 236, fill: K }, g);
    el('rect', { x: GATE - 110, y: BY - 250, width: 220, height: 40, fill: RED, stroke: K, 'stroke-width': 4 }, g);
    el('text', { x: GATE, y: BY - 220, 'text-anchor': 'middle', 'font-family': BRUSH, 'font-size': 30, fill: PHI, text: '工 位' }, g);
    const legend = el('g', { transform: 'translate(120,340)' }, g);
    el('rect', { x: 0, y: 0, width: 330, height: 150, fill: PHI, stroke: K, 'stroke-width': 3 }, legend);
    ['棉花 → 按 1 纺', '纱锭 → 按 2 织', '白布 → 按 3 染', '色布 → 不按，放行'].forEach((t, i) =>
      el('text', { x: 20, y: 34 + i * 33, 'font-size': 20, fill: i === 3 ? RED : K, 'font-family': '"Noto Serif SC",serif', text: t }, legend));
    const TYPES = ['cotton', 'yarn', 'cloth', 'dyed'], NEED = { cotton: 1, yarn: 2, cloth: 3, dyed: 0 }, NEXT = { cotton: 'yarn', yarn: 'cloth', cloth: 'dyed' };
    const drawItem = (gg, type) => {
      gg.innerHTML = '';
      if (type === 'cotton') { el('path', { d: ellD(-18, -10, 20, 16) + ellD(14, -14, 22, 18) + ellD(0, -30, 20, 16), fill: PHI, stroke: K, 'stroke-width': 3 }, gg); }
      if (type === 'yarn') { const s = el('g', { transform: 'translate(0,-26) scale(1.3)' }, gg); spool(s, false); }
      if (type === 'cloth' || type === 'dyed') {
        for (let i = 0; i < 3; i++) el('rect', { x: -40, y: -18 - i * 16, width: 80, height: 16, fill: type === 'dyed' ? RED : PHI, stroke: K, 'stroke-width': 3 }, gg);
      }
    };
    const items = [], seq = [];
    for (let i = 0; i < n; i++) seq.push(TYPES[Math.floor(R(0, i < 4 ? 3 : 4))]);
    let spawned = 0, last = performance.now() - 2000, ok = 0, bad = 0, finished = false, lastT = performance.now();
    const btns = [...$('lineUI').querySelectorAll('button')];
    $('lineUI').classList.add('on'); dlg.classList.remove('show');
    gText.textContent = '按 1 / 2 / 3 或点击下方按钮 · 色布不用加工'; gPrompt.classList.add('on');
    const pop = (it, txt, good) => {
      const t = el('text', { x: it.x, y: BY - 110, 'text-anchor': 'middle', 'font-family': BRUSH, 'font-size': 40, fill: good ? K : RED, text: txt }, g);
      tween(700, k => { t.setAttribute('y', f1(BY - 110 - k * 50)); t.setAttribute('opacity', f1(1 - k)); }).then(() => t.remove());
    };
    const press = k => {
      if (finished) return;
      const b = btns[k - 1]; if (b) { b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 150); }
      const it = items.find(it => !it.judged && Math.abs(it.x - GATE) < 95);
      if (!it) return;
      it.judged = true;
      if (NEED[it.type] === k) { ok++; it.type = NEXT[it.type]; drawItem(it.g, it.type); pop(it, '✓', true); }
      else { bad++; el('path', { d: 'M-30,-60 L30,0 M30,-60 L-30,0', stroke: RED, 'stroke-width': 7 }, it.g); pop(it, '✗', false); }
    };
    const onKey = e => { const k = { '1': 1, '2': 2, '3': 3 }[e.key]; if (k) { e.preventDefault(); press(k); } };
    addEventListener('keydown', onKey);
    const onBtn = e => { e.stopPropagation(); press(+e.currentTarget.dataset.k); };
    btns.forEach(b => { b.addEventListener('pointerdown', onBtn); });
    let off = 0;
    const loop = () => {
      if (finished) return;
      const now = performance.now(), dt = Math.min(50, now - lastT) / 16.667; lastT = now;
      const prog = spawned / n, v = 3.6 + prog * 2.6, gap = 1500 - prog * 650;
      if (spawned < n && now - last > gap) {
        last = now; const it = { x: 0, type: seq[spawned], g: el('g', {}, g), judged: false };
        drawItem(it.g, it.type); items.push(it); spawned++;
      }
      off = (off + v * dt) % 26; dash.setAttribute('transform', `translate(${f1(off)},0)`);
      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i]; it.x += v * dt;
        it.g.setAttribute('transform', `translate(${f1(it.x)},${BY})`);
        if (!it.judged && it.x > GATE + 95) {
          it.judged = true;
          if (NEED[it.type] === 0) { ok++; pop(it, '放行', true); } else { bad++; pop(it, '漏', false); }
        }
        if (it.x > 1620) { it.g.remove(); items.splice(i, 1); }
      }
      if (spawned >= n && !items.length) return finish(false);
      tick(loop);
    };
    function finish(skipped) {
      if (finished) return; finished = true;
      removeEventListener('keydown', onKey); btns.forEach(b => b.removeEventListener('pointerdown', onBtn));
      $('lineUI').classList.remove('on'); gPrompt.classList.remove('on'); Cut.cancel = null;
      res({ score: skipped ? null : ok / n, ok, bad });
    }
    tick(loop);
    Cut.cancel = () => finish(true); if (Cut.skip) finish(true);
  });
}

  $('endGrades').innerHTML = game.grades.map((g, i) => { const gr = gradeOf(g); return `<div><b class="${gr === '—' ? 'none' : ''}">${gr}</b>${names[i]}</div>`; }).join('');
  $('endGot').innerHTML = `共收集 <b>纱线 ${game.got}</b> · 图鉴 <b>${game.cards.size} / ${CARDS.length}</b>`;
  saveChapter(CHAPTER_ID, { grades: game.grades, res: game.got, resName: RES_NAME, cards: [...game.cards] });
  card.classList.remove('show'); $('ending').classList.add('show'); state = 'end';
}

let last = performance.now();
function frame(t) {
  const dt = Math.min(50, t - last) / 16.667; last = t;
  let want = 0;
  const active = state === 'play' && !bookOpen;
  if (active) {
    if (dragging) want = clamp(((camX + pX / s) - px) * .05, -MAXV, MAXV);
    if (keyDir) want = keyDir * MAXV;
    want = clamp(want + wheelImp, -MAXV, MAXV);
  } else if (state === 'moor') want = clamp((MAXX - px) * .03, -2, 2);
  wheelImp *= Math.pow(.9, dt);
  vx += (want - vx) * .15 * dt;
  if (wantJump && onGround && active) { vy = JUMP; onGround = false; }
  wantJump = false;
  if (!onGround) { vy += GRAV * dt; py += vy * dt; if (py >= G) { py = G; vy = 0; onGround = true; } }
  px = clamp(px + vx * dt, MINX, MAXX);
  if (invuln > 0) invuln -= dt;
  walkPh += Math.abs(vx) * dt * .085;
  if (vx > .3) facing = 1; else if (vx < -.3) facing = -1;

  if (state === 'play' && next < NODES.length && px >= NODES[next].trig && onGround) triggerNode(next++);
  if (px > MINX + 160) hint.classList.add('hide');

  const camT = clamp(px - VW * .36, 0, Math.max(0, W - VW));
  camX = Number.isFinite(camX) ? camX + (camT - camX) * .08 * dt : camT;
  for (const L of Object.values(LAYERS)) L.div.style.transform = `translate3d(${-camX * L.f * s}px,0,0)`;

  // 人物动作：走路摆臂摆腿，空中收腿
  const sw = Math.sin(walkPh), amp = Math.min(1, Math.abs(vx) / 3);
  const rot = (gp, a, cx, cy) => gp.setAttribute('transform', `rotate(${f1(a)},${cx},${cy})`);
  if (onGround) { rot(PL.bl, -sw * 26 * amp, 80, 236); rot(PL.fl, sw * 26 * amp, 80, 236); rot(PL.ba, sw * 20 * amp, 81, 108); rot(PL.fa, -sw * 20 * amp, 81, 108); }
  else { rot(PL.bl, -30, 80, 236); rot(PL.fl, 24, 80, 236); rot(PL.ba, -40, 81, 108); rot(PL.fa, -60, 81, 108); }
  const bob = onGround ? -Math.abs(sw) * 3 * amp : 0, blink = invuln > 0 && Math.floor(t / 90) % 2;
  const sc = .82;
  playerDiv.style.transform = `translate3d(${(px - camX - PW * sc / 2) * s}px,${(py - PH * sc + bob) * s}px,0) scaleX(${facing})`;
  playerDiv.style.opacity = blink ? .35 : 1;

  // 纱锭
  for (const it of items) {
    if (!it.alive) continue;
    const y = it.y + Math.sin(t * .003 + it.ph) * 4;
    it.el.setAttribute('transform', `translate(${f1(it.x)},${f1(y)})`);
    if (state === 'play' && Math.abs(it.x - px) < 40 && y > py - 230 && y < py + 10) {
      it.alive = false; it.el.style.transition = 'opacity .3s'; it.el.style.opacity = 0; setTimeout(() => it.el.remove(), 300);
      addInk(it.air ? 2 : 1, it.x, y);
    }
    if (!seen.air && it.air && Math.abs(it.x - px) < 300 && state === 'play') { seen.air = true; banner('空中的红纱锭值 2 卷——跳起来够它！'); }
  }
  // 黄包车：靠近时启动，朝人迎面驶来
  for (const h of hazards) {
    if (h.done) continue;
    if (!h.active && state === 'play' && px > h.x0 - 1150) { h.active = true; if (!seen.rick) { seen.rick = true; banner('黄包车来了——向上滑动 / ↑ / 空格 跳过去！'); } }
    if (h.active && (state === 'play' || state === 'moor')) h.x -= h.sp * dt;
    h.el.setAttribute('transform', `translate(${f1(h.x)},${G})`);
    h.wheel.setAttribute('transform', `translate(30,-48) rotate(${f1(-(h.x0 - h.x) / 46 * 57.3)})`);
    h.legs.setAttribute('transform', `rotate(${f1(Math.sin(t * .02) * 12)},-102,-84)`);
    if (state === 'play' && invuln <= 0 && Math.abs(h.x - px) < 90 && py > G - 110) {
      invuln = 80; vx = -6; vy = -8; onGround = false;
      loseInk(2, px, G - 260, '撞上黄包车 · 纱 -2');
    }
    if (h.x < px - 1600) { h.done = true; h.el.remove(); }
  }
  // 木屑
  for (let i = chips.length - 1; i >= 0; i--) {
    const c = chips[i]; c.x += c.vx * dt; c.y += c.vy * dt; c.vy += .4 * dt;
    c.e.setAttribute('transform', `translate(${f1(c.x)},${f1(c.y)}) rotate(${f1(c.x)})`);
    if (c.y > G + 20) { c.e.remove(); chips.splice(i, 1); }
  }
  tick(frame);
}
tick(frame);
})();
</script>
